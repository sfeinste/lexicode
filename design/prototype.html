<title>Lexicode Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   Lexicode Console — interactive design prototype
   Dark-committed app chrome. Light is an in-app product toggle,
   not a response to the host theme: this is a mockup of a dark
   developer tool, so it paints its own ground either way.
   ============================================================ */

:root{
  --bg:#0b0d10;
  --surface:#121519;
  --surface-2:#181c22;
  --surface-3:#1f242b;
  --border:#232830;
  --border-strong:#39414d;
  --text:#e6e9ef;
  --text-2:#98a2b0;
  --text-3:#68727e;

  --accent:#6c7cff;
  --accent-dim:#6c7cff26;
  --running:#3fb8d4;
  --needs:#e0a33e;
  --ok:#3fb37f;
  --fail:#e05563;
  --halt:#a072e0;
  --muted:#68727e;

  --shadow:0 8px 24px -8px #00000099;
  --r:5px;

  --sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#f1f3f6;
  --surface-3:#e6e9ee;
  --border:#dfe3e9;
  --border-strong:#b4bcc7;
  --text:#161a20;
  --text-2:#5b6572;
  --text-3:#89939f;
  --accent:#4a5ae8;
  --accent-dim:#4a5ae81f;
  --running:#1789a5;
  --needs:#a97314;
  --ok:#1f8558;
  --fail:#c8384a;
  --halt:#7a49bf;
  --muted:#89939f;
  --shadow:0 8px 24px -10px #0f172a30;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;padding:0;}
a{color:var(--accent);text-decoration:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px;}
::selection{background:var(--accent-dim);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ---------- primitives ---------- */
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;}
.lbl{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);
}
.t2{color:var(--text-2);}
.t3{color:var(--text-3);}
.num{font-variant-numeric:tabular-nums;}
.row{display:flex;align-items:center;gap:8px;}
.col{display:flex;flex-direction:column;}
.grow{flex:1;min-width:0;}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hr{height:1px;background:var(--border);border:0;margin:0;}
.scrollx{overflow-x:auto;}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);
}
.pad{padding:14px 16px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 10px;border-radius:var(--r);
  border:1px solid var(--border-strong);background:var(--surface-2);
  color:var(--text);font-size:12px;font-weight:500;
  transition:background .12s ease-out,border-color .12s ease-out;
}
.btn:hover{background:var(--surface-3);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.1);}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2);}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);}
.btn.sm{height:24px;padding:0 8px;font-size:11px;}
.btn.ok{border-color:#3fb37f55;color:var(--ok);}
.btn.fail{border-color:#e0556355;color:var(--fail);}

.kbd{
  font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--surface-3);border:1px solid var(--border);color:var(--text-3);
}

.chip{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;
  border-radius:3px;background:var(--surface-2);border:1px solid var(--border);
  font-size:11px;color:var(--text-2);white-space:nowrap;
}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

/* status: colour AND glyph, never colour alone */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;}
.st .g{font-size:11px;line-height:1;}
.st-queued,.st-canceled,.st-noaction{color:var(--muted);}
.st-provisioning,.st-running{color:var(--running);}
.st-needs,.st-approval{color:var(--needs);}
.st-completed,.st-ok{color:var(--ok);}
.st-failed,.st-timeout{color:var(--fail);}
.st-halt{color:var(--halt);}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.bar{display:inline-block;width:100%;height:3px;vertical-align:middle;border-radius:2px;background:var(--surface-3);overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--accent);}

/* ---------- app frame ---------- */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

.topbar{
  height:40px;flex:0 0 40px;display:flex;align-items:center;gap:14px;
  padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:-.01em;}
.brand .mark{
  width:18px;height:18px;border-radius:4px;flex:0 0 18px;
  background:linear-gradient(135deg,var(--accent),var(--running));
  display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;
}
.topnav{display:flex;gap:2px;}
.topnav button{
  height:24px;padding:0 9px;border-radius:var(--r);font-size:12px;color:var(--text-2);
}
.topnav button:hover{background:var(--surface-2);color:var(--text);}
.topnav button.sel{background:var(--surface-3);color:var(--text);}
.search{
  flex:1;max-width:380px;height:26px;display:flex;align-items:center;gap:7px;
  padding:0 9px;border-radius:var(--r);background:var(--surface-2);
  border:1px solid var(--border);color:var(--text-3);font-size:12px;cursor:pointer;
}
.search:hover{border-color:var(--border-strong);}
.avatar{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:600;color:#fff;flex:0 0 22px;
}

.main{flex:1;display:flex;min-height:0;}

.rail{
  width:208px;flex:0 0 208px;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;
}
.rail.mini{width:48px;flex-basis:48px;}
.rail.mini .rail-txt{display:none;}
.rail-sec{padding:12px 10px 4px;}
.rail-item{
  display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;
  border-radius:var(--r);color:var(--text-2);font-size:12.5px;cursor:pointer;width:100%;
  text-align:left;
}
.rail-item:hover{background:var(--surface-2);color:var(--text);}
.rail-item.sel{background:var(--surface-3);color:var(--text);font-weight:500;}
.dotk{width:7px;height:7px;border-radius:2px;flex:0 0 7px;}
.rail-needs{margin-top:auto;border-top:1px solid var(--border);padding:8px 10px 10px;}
.needsrow{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:5px 8px;border-radius:var(--r);cursor:pointer;
}
.needsrow:hover{background:var(--surface-2);}

.pane{flex:1;display:flex;flex-direction:column;min-width:0;}

.phead{
  padding:12px 18px 0;background:var(--surface);border-bottom:1px solid var(--border);
}
.ptitle{display:flex;align-items:center;gap:10px;}
.ptitle h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;}
.tabs{display:flex;gap:1px;margin-top:11px;}
.tabs button{
  height:31px;padding:0 11px;font-size:12.5px;color:var(--text-2);
  border-bottom:2px solid transparent;border-radius:var(--r) var(--r) 0 0;
}
.tabs button:hover{color:var(--text);background:var(--surface-2);}
.tabs button.sel{color:var(--text);border-bottom-color:var(--accent);font-weight:500;}
.tabs .cnt{
  margin-left:6px;font-size:10px;padding:0 5px;border-radius:8px;
  background:var(--surface-3);color:var(--text-2);
}
.tabs .cnt.hot{background:#e0a33e26;color:var(--needs);}

.body{flex:1;overflow:auto;padding:16px 18px 40px;}
.body.flush{padding:0;}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;}
.tbl th{
  text-align:left;font-size:10px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-3);padding:6px 10px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.tbl td{padding:0 10px;height:32px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tbody tr{cursor:pointer;}
.tbl tbody tr:hover td{background:var(--surface-2);}

/* ---------- needs-you ---------- */
.needsstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.ncard{
  min-width:290px;flex:0 0 290px;background:var(--surface);
  border:1px solid var(--border);border-left:2px solid var(--needs);
  border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:7px;
}
.ncard.fail{border-left-color:var(--fail);}
.ncard.halt{border-left-color:var(--halt);}
.ncard.ok{border-left-color:var(--ok);}
.flavor{font-size:11.5px;font-weight:600;}

/* ---------- board ---------- */
.boardbar{
  display:flex;align-items:center;gap:8px;padding:10px 18px;
  border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;
}
.lane{
  margin:14px 18px 0;border:1px solid var(--border);border-left:2px solid var(--needs);
  border-radius:var(--r);background:var(--surface);
}
.lane-h{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
}
.lane-b{display:flex;gap:10px;padding:10px 12px;overflow-x:auto;}
.cols{display:flex;gap:12px;padding:14px 18px 24px;overflow-x:auto;align-items:flex-start;}
.bcol{width:274px;flex:0 0 274px;display:flex;flex-direction:column;gap:8px;}
.bcol-h{display:flex;align-items:center;gap:7px;padding:0 3px;}
.bcol-h .n{font-size:12px;font-weight:600;}
.wip{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.wip.warn{color:var(--needs);}
.wip.over{color:var(--fail);}
.tcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  transition:border-color .12s ease-out;
}
.tcard:hover{border-color:var(--border-strong);}
.tcard .ttl{font-size:12.5px;line-height:1.35;}
.tcard .meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-3);}
.agentpill{
  display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px 0 3px;
  border-radius:9px;background:var(--surface-3);font-size:10.5px;color:var(--text-2);
}
.agentpill i{width:12px;height:12px;border-radius:50%;display:inline-block;}
.diffstat{font-family:var(--mono);font-size:10.5px;}
.diffstat .a{color:var(--ok);}
.diffstat .d{color:var(--fail);}

/* ---------- three pane ---------- */
.p3{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;height:100%;min-height:0;}
.p3>*{overflow:auto;min-width:0;}
.p3 .mid{border-left:1px solid var(--border);border-right:1px solid var(--border);}
.p2{display:grid;grid-template-columns:minmax(0,1fr) 282px;gap:0;height:100%;min-height:0;}
.p2>*{overflow:auto;min-width:0;}
.p2 .side{border-left:1px solid var(--border);background:var(--surface);}

/* ---------- run log ---------- */
.steps{display:flex;flex-direction:column;}
.step{
  display:flex;align-items:flex-start;gap:8px;padding:6px 12px;cursor:pointer;
  border-left:2px solid transparent;font-size:12px;
}
.step:hover{background:var(--surface-2);}
.step.sel{background:var(--surface-2);border-left-color:var(--accent);}
.step .tm{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3);}
.segbar{display:flex;height:3px;border-radius:2px;overflow:hidden;width:46px;flex:0 0 46px;opacity:.85;}
.segbar i{display:block;height:100%;}
.logline{
  font-family:var(--mono);font-size:12px;line-height:1.6;padding:1px 0;
  white-space:pre-wrap;word-break:break-word;
}
.logblock{
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  margin-bottom:10px;overflow:hidden;
}
.logblock>h4{
  margin:0;font-size:11.5px;font-weight:600;padding:7px 11px;
  background:var(--surface-2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.logblock .bd{padding:9px 11px;overflow-x:auto;}
.diffline{font-family:var(--mono);font-size:12px;padding:0 8px;white-space:pre;}
.diffline.add{background:#3fb37f1c;color:var(--ok);}
.diffline.del{background:#e055631c;color:var(--fail);}
.diffline.ctx{color:var(--text-2);}

.approve{
  border:1px solid var(--needs);background:#e0a33e12;border-radius:var(--r);
  padding:11px 12px;display:flex;flex-direction:column;gap:9px;margin-bottom:10px;
}
.currentstep{
  display:flex;align-items:center;gap:9px;padding:7px 14px;
  border-top:1px solid var(--border);background:var(--surface-2);font-size:12px;
}
.steer{
  display:flex;gap:8px;padding:9px 14px;border-top:1px solid var(--border);
  background:var(--surface);align-items:center;
}
.steer input{
  flex:1;height:28px;padding:0 10px;border-radius:var(--r);
  background:var(--surface-2);border:1px solid var(--border);
}
.steer input:focus{border-color:var(--border-strong);outline:none;}

/* ---------- wiki ---------- */
.tree{padding:8px;}
.tnode{
  display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:var(--r);
  cursor:pointer;font-size:12.5px;color:var(--text-2);width:100%;text-align:left;
}
.tnode:hover{background:var(--surface-2);color:var(--text);}
.tnode.sel{background:var(--surface-3);color:var(--text);}
.tnode.child{padding-left:20px;}
.scope{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1px 4px;
  border-radius:3px;border:1px solid var(--border);color:var(--text-3);margin-left:auto;
}
.scope.always{color:var(--needs);border-color:#e0a33e55;background:#e0a33e14;}
.scope.auto{color:var(--running);border-color:#3fb8d455;}
.scope.paths{color:var(--accent);border-color:#6c7cff55;}
.scope.never{opacity:.55;}
.meter{padding:9px 11px;border-bottom:1px solid var(--border);background:var(--surface-2);}
.prose{max-width:68ch;}
.prose h2{font-size:15px;margin:22px 0 8px;font-weight:600;}
.prose h3{font-size:13px;margin:18px 0 6px;font-weight:600;color:var(--text-2);}
.prose p{margin:0 0 10px;color:var(--text-2);line-height:1.62;}
.prose ul{margin:0 0 10px;padding-left:18px;color:var(--text-2);line-height:1.62;}
.prose code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 4px;border-radius:3px;color:var(--text);}

/* ---------- triggers ---------- */
.rule{
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  margin-bottom:10px;overflow:hidden;cursor:pointer;
}
.rule:hover{border-color:var(--border-strong);}
.rule-h{display:flex;align-items:center;gap:9px;padding:10px 13px;}
.rule-b{padding:0 13px 10px;display:flex;flex-direction:column;gap:3px;}
.clause{display:flex;gap:9px;font-size:12px;}
.clause>b{
  font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--text-3);
  width:38px;flex:0 0 38px;padding-top:2px;
}
.rule-f{
  display:flex;align-items:center;gap:9px;padding:7px 13px;
  border-top:1px solid var(--border);background:var(--surface-2);font-size:11px;
}
.spark{display:flex;gap:2px;align-items:flex-end;height:12px;}
.spark i{width:4px;border-radius:1px;display:block;}
.toggle{
  width:30px;height:17px;border-radius:9px;background:var(--surface-3);
  border:1px solid var(--border-strong);position:relative;flex:0 0 30px;cursor:pointer;
}
.toggle i{
  position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;
  background:var(--text-3);transition:.12s ease-out;
}
.toggle.on{background:var(--accent);border-color:var(--accent);}
.toggle.on i{left:14px;background:#fff;}
.builder{display:flex;flex-direction:column;gap:0;}
.bsec{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:10px;}
.bsec>header{
  padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;gap:9px;
}
.bsec>.bd{padding:11px 12px;display:flex;flex-direction:column;gap:9px;}
select.f,input.f{
  height:26px;padding:0 8px;border-radius:var(--r);background:var(--surface-2);
  border:1px solid var(--border);font-size:12px;
}
select.f:focus,input.f:focus{border-color:var(--border-strong);outline:none;}
.guard{
  display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--border);
}
.guard:first-child{border-top:0;}
.chain{display:flex;flex-direction:column;gap:0;font-family:var(--mono);font-size:11.5px;}
.chain .n{display:flex;align-items:center;gap:8px;padding:3px 0;}
.chain .n.rep{color:var(--halt);}
.chain .ln{width:1px;height:10px;background:var(--border-strong);margin-left:5px;}

/* ---------- misc ---------- */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.empty{
  max-width:360px;margin:64px auto;text-align:center;display:flex;
  flex-direction:column;gap:9px;align-items:center;
}
.empty h3{margin:0;font-size:14px;font-weight:600;}
.note{
  border-left:2px solid var(--accent);background:var(--accent-dim);
  padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:12px;color:var(--text-2);
}
.overlay{
  position:fixed;inset:0;background:#000000aa;display:grid;place-items:center;z-index:50;
  padding:24px;
}
.sheet{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;
  box-shadow:var(--shadow);max-width:560px;width:100%;max-height:80vh;overflow:auto;
}
.klist{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;}
.klist div{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;color:var(--text-2);}
.klist div span{margin-left:auto;}

@media (max-width:1180px){
  .p3{grid-template-columns:220px minmax(0,1fr);}
  .p3>.right{display:none;}
}
@media (max-width:900px){
  .rail{width:48px;flex-basis:48px;}
  .rail .rail-txt{display:none;}
  .p2{grid-template-columns:minmax(0,1fr);}
  .p2>.side{display:none;}
}
</style>

<div id="app"></div>

<script>
/* ============================================================
   Fake data. Realistic enough to judge density and hierarchy.
   ============================================================ */
const AG = {
  dev:      {id:'dev',      name:'Dev',       color:'#6c7cff', role:'Implements tickets, opens PRs', model:'claude-opus-5', autonomy:'Auto with gates', runs:34, ok:82, spend:38.10},
  reviewer: {id:'reviewer', name:'Reviewer',  color:'#a072e0', role:'Reviews PRs, never writes code', model:'claude-opus-5', autonomy:'Auto', runs:41, ok:95, spend:11.40},
  docs:     {id:'docs',     name:'Docs',      color:'#3fb37f', role:'Writes and maintains the wiki', model:'claude-sonnet-4-6', autonomy:'Approve each action', runs:9, ok:89, spend:2.75},
  architect:{id:'architect',name:'Architect', color:'#e0a33e', role:'Technical design before implementation', model:'claude-opus-5', autonomy:'Suggest', runs:6, ok:100, spend:6.20}
};

const PROJECTS = [
  {key:'PAY', name:'Payments Service', color:'#6c7cff', repo:'acme/payments-svc', branch:'main',
   sha:'a91f0c2', shaMsg:'fix: retry budget on 429', open:14, running:3, needs:3, spend:47.20, cap:120, last:'2m ago',

function tcard(t){

  const doneAc = ac.filter(Boolean).length;
  return `<div class="tcard" data-act="ticket" data-k="${t.key}">
    <div class="row">

      ${t.st?stat(t.st, t.st==='needs'?(t.flavor||'Needs you'):undefined):''}
    </div>
    <div class="ttl">${esc(t.title)}</div>
    ${ac.length?`<div class="row" style="gap:6px">
      <span class="bar" style="width:52px"><i style="width:${Math.round(doneAc/ac.length*100)}%;background:var(--ok)"></i></span>
      <span class="t3" style="font-size:10.5px">${doneAc}/${ac.length} acceptance criteria</span></div>`:''}
    <div class="meta">
      ${t.agent?apill(t.agent):'<span class="t3" style="font-size:10.5px">no delegate</span>'}

      ${diff(t.add, t.del)}
      ${t.pr?`<span class="mono t3" style="font-size:10.5px">#${t.pr}</span>`:''}
    </div>
  </div>`;
}

}

      <div class="prose" style="margin-bottom:18px">
        <p>Charges are currently non-idempotent: a client retry after a timeout can double-charge. Accept an <code>Idempotency-Key</code> header on <code>POST /v1/charges</code>, persist the request fingerprint and the response, and replay on a repeat key.</p>

      </div>

      <div class="lbl" style="margin-bottom:9px">Activity</div>
      <div class="col" style="gap:10px">
        ${streamItem('SF','created the ticket and delegated to Dev','2h ago')}

        <div class="card" style="border-left:2px solid ${a.color}">

            ${apill(t.agent)}

            <div class="row t3 mono" style="font-size:11px;gap:14px">

            </div>
            <div class="approve" style="margin:0">
              <div class="row"><span class="st st-needs"><span class="g">▲</span></span><b style="font-size:12px">Dev is asking a question</b><div class="grow"></div><span class="t3" style="font-size:11px">12m ago</span></div>
              <div class="t2" style="font-size:12.5px;line-height:1.6">${esc(t.ask||'')}</div>
              <div class="row"><input class="f grow" placeholder="Answer…" style="height:28px"><button class="btn sm primary">Send</button></div>
            </div>
          </div>
        </div>

        ${streamItem('system','⚡ Trigger <b>Review new PRs</b> matched but took no action — PR is still draft','40m ago')}
        ${streamItem('JD','Careful with the 24h expiry — Stripe keeps keys for 24h too, so we should not out-live them.','25m ago')}
      </div>

      <div class="card" style="margin-top:14px;padding:10px 12px">

/* ---------- wiki ---------- */
function flatWiki(){
  const out = [];
  WIKI.forEach(w => { out.push({...w, depth:0}); (w.kids||[]).forEach(k => out.push({...k, depth:1})); });
  return out;
}
function vWiki(){
  const all = flatWiki();
  const pg = all.find(w => w.slug===S.page) || all[0];
  const always = all.filter(w => w.scope==='always');
  const words = always.reduce((s,w)=>s+w.words,0);
  const tokens = Math.round(words*1.32);
  const pct = Math.min(100, Math.round(tokens/4000*100));
  return `<div class="body flush"><div class="p3">
    <div>
      <div class="meter">
        <div class="row" style="margin-bottom:5px"><span class="lbl">Always-on context</span><div class="grow"></div><span class="mono t2" style="font-size:11px">~${(tokens/1000).toFixed(1)}k tok</span></div>
        <span class="bar"><i style="width:${pct}%;background:${pct>70?'var(--needs)':'var(--accent)'}"></i></span>
        <div class="t3" style="font-size:10.5px;margin-top:4px">${always.length} pages · ${words} words · budget 4k</div>
      </div>
      <div style="padding:8px 8px 0">
        <div class="search" style="max-width:none;width:100%"><span>⌕</span><span class="grow" style="text-align:left">Search the wiki</span><span class="kbd">/</span></div>
      </div>
      <div class="tree">
        ${all.map(w => `<button class="tnode ${w.depth?'child':''} ${pg.slug===w.slug?'sel':''}" data-act="page" data-k="${w.slug}"
          style="${w.proposed?'border:1px dashed var(--border-strong)':''}">
          <span class="t3" style="font-size:10px">${w.depth?'└':'▸'}</span>
          <span class="trunc">${esc(w.title)}</span>
          ${w.proposed?'<span class="scope" style="color:var(--accent);border-color:#6c7cff66">PROPOSED</span>':`<span class="scope ${w.scope}">${w.scope.toUpperCase()}</span>`}
        </button>`).join('')}
        <button class="tnode" style="color:var(--text-3);margin-top:6px">+ New page</button>
      </div>
    </div>

    <div class="mid" style="padding:18px 24px 40px">
      ${pg.proposed?`<div class="approve" style="border-color:var(--accent);background:var(--accent-dim)">
        <div class="row"><b style="font-size:12px">Docs proposed this page after run #489</b><div class="grow"></div><span class="t3" style="font-size:11px">1h ago</span></div>
        <div class="t2" style="font-size:12px;line-height:1.55">Agents propose; humans accept. Nothing is ever written to the wiki automatically.</div>
        <div class="row"><button class="btn sm primary">Accept</button><button class="btn sm">Edit first</button><button class="btn ghost sm">Dismiss</button></div>
      </div>`:''}
      <div class="row" style="margin-bottom:6px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em">${esc(pg.title)}</h2>
        <div class="grow"></div>
        <button class="btn sm">Edit</button>
      </div>
      <div class="row" style="margin-bottom:18px;flex-wrap:wrap;gap:8px">
        <span class="chip">${av(pg.owner)} owner</span>
        <span class="chip" style="${pg.stale?'color:var(--fail);border-color:#e0556355':''}">verified until ${esc(pg.verified)}${pg.stale?' · expired':''}</span>
        <span class="chip"><span class="scope ${pg.scope}" style="margin:0">${pg.scope.toUpperCase()}</span>${pg.paths?`<span class="mono" style="font-size:10.5px">${esc(pg.paths)}</span>`:''}</span>
      </div>
      ${pg.stale?`<div class="note" style="border-left-color:var(--fail);background:#e0556314;margin-bottom:16px">Verification expired. An <b>always</b>-scoped page whose verification lapses is demoted to <b>auto</b> and flagged rather than silently steering every run with stale instructions.</div>`:''}
      <div class="prose">
        <p>${esc(pg.title)} — the conventions below are loaded into agent runs on this project. Keep them to pitfalls, rationale and conventions that differ from tool defaults; cut anything an agent can read straight off the codebase.</p>
        <h2>Branch and commit</h2>
        <ul>
          <li>Branch names are <code>{agent}/{ticket-key}-{slug}</code>.</li>
          <li>Conventional commits. The ticket key goes in the body, not the subject.</li>
          <li>Never force-push a branch that already has a review on it.</li>
        </ul>
        <h2>Pull requests</h2>
        <ul>
          <li>Under 400 changed lines. Split rather than explain.</li>
          <li>The description states intent, not a diff summary — the diff is already there.</li>
          <li>Test changes get read with suspicion: an assertion loosened to make a suite pass is a defect, not a fix.</li>
        </ul>
        <h2>What not to do</h2>
        <ul>
          <li>Do not add a dependency without saying why in the PR body.</li>
          <li>Do not touch <code>infra/</code> from a feature ticket.</li>
        </ul>
      </div>

      <div class="hr" style="margin:26px 0 14px"></div>
      <div class="lbl" style="margin-bottom:9px">Backlinks</div>
      <div class="col" style="gap:9px;max-width:68ch">
        ${[['PAY-14','…following the <b>Engineering conventions</b> page, the branch is dev/PAY-14-idempotency and the PR stays under 400 lines.'],
           ['Deployment runbook','Before a release, confirm the change follows <b>Engineering conventions</b> — particularly the force-push rule.']]
          .map(([src,txt]) => `<div class="card pad" style="padding:9px 12px">
            <div class="mono t3" style="font-size:11px;margin-bottom:3px">${esc(src)}</div>
            <div class="t2" style="font-size:12px;line-height:1.55">${txt}</div>
          </div>`).join('')}
        <button class="btn ghost sm" style="align-self:flex-start">▸ Unlinked mentions (3)</button>
      </div>
    </div>

    <div class="right" style="padding:16px 14px">
      <div class="lbl" style="margin-bottom:8px">On this page</div>
      <div class="col" style="gap:5px;margin-bottom:20px">
        ${['Branch and commit','Pull requests','What not to do'].map(h=>`<a href="#" onclick="return false" class="t2" style="font-size:12px">${h}</a>`).join('')}
      </div>
      <div class="lbl" style="margin-bottom:8px">Agent scope</div>
      <div class="col" style="gap:4px">
        ${[['always','Loaded into every run'],['auto','Retrieved when the task matches'],['paths','Loaded when a matching file is touched'],['manual','Only when @mentioned'],['never','Human-only, never sent']].map(([k,d])=>`
          <label class="row" style="align-items:flex-start;gap:7px;padding:5px 6px;border-radius:var(--r);background:${pg.scope===k?'var(--surface-2)':'transparent'}">
            <span style="color:var(--${pg.scope===k?'accent':'text-3'})">${pg.scope===k?'◉':'○'}</span>
            <span class="col" style="gap:1px">
              <span class="scope ${k}" style="margin:0;align-self:flex-start">${k.toUpperCase()}</span>
              <span class="t3" style="font-size:11px">${d}</span>
            </span>
          </label>`).join('')}
      </div>
    </div>
  </div></div>`;
}

function sparkline(o){
  const map = {ok:'var(--ok)', noaction:'var(--muted)', halt:'var(--halt)', errored:'var(--fail)'};
  const out = [];
  Object.entries(o).forEach(([k,n]) => { for(let i=0;i<n;i++) out.push(map[k]); });
  return `<span class="spark">${out.map(c=>`<i style="height:${8+Math.round(Math.random()*4)}px;background:${c}"></i>`).join('')}</span>`;
}

        <span class="t3">${Object.entries(t.outcome).map(([k,n])=>`${n} ${({ok:'ok',noaction:'no action',halt:'loop stopped',errored:'errored'})[k]}`).join(' · ')}</span>
        <div class="grow"></div>
        <span class="t3">Ignores events from <span class="mono">${esc(t.suppress)}</span></span>
        <span class="t3">last ${esc(t.last)}</span>
      </div>
    </div>`).join('')}
    <div class="note" style="margin-top:6px">“No action” is its own outcome class with its own colour. <i>The rule fired but nothing happened</i> is the most common confusion in every automation product, and naming it solves most of it.</div>
  </div>`;
}

function vTrigger(){
  const t = TRIGGERS.find(x=>x.id===S.trig) || TRIGGERS[0];
  const guards = [
    ['Actor suppression', 1, `Ignore events caused by <span class="mono">${esc(t.suppress)}</span> — this agent's own identity`],
    ['Debounce', 1, 'Collapse a burst of pushes on the same PR into one run · <span class="mono">90s</span>'],
    ['Cancel in progress', 1, 'A new push supersedes the running review rather than queueing behind it'],
    ['Depth limit', 1, 'Stop after <span class="mono">3</span> agent-caused re-triggers on the same pull request'],
    ['Budget ceiling', 1, 'Stop when this rule has spent <span class="mono">$25</span> in a day · inherited from project']
  ];
  return `<div class="body" style="max-width:820px">
    <div class="row" style="margin-bottom:16px">
      <button class="btn ghost sm" data-act="go" data-v="triggers">← Triggers</button>
      <h2 style="margin:0;font-size:16px">${esc(t.name)}</h2>
      <div class="grow"></div>
      <span class="toggle ${t.on?'on':''}"><i></i></span>
      <button class="btn sm">Save</button>
    </div>

    <div class="builder">
      <div class="bsec"><header><b style="font-size:10px;letter-spacing:.09em;color:var(--needs)">WHEN</b><span class="t3" style="font-size:11.5px">the event, then which activities, then filters</span></header>
        <div class="bd">
          <div class="row" style="flex-wrap:wrap;gap:7px">
            <select class="f"><option>pull_request</option><option>pull_request_review</option><option>check_suite</option><option>issue_comment</option><option>ticket</option><option>run</option><option>schedule</option></select>
            <span class="t3">→</span>
            <span class="chip on">opened</span><span class="chip on">ready_for_review</span>
            <span class="chip">synchronize</span><span class="chip">closed</span>
            <button class="btn ghost sm">+</button>
          </div>
          <div class="note" style="border-left-color:var(--needs);background:#e0a33e12">
            <b>opened</b> fires once, when the PR is created. <b>synchronize</b> fires on every push — that is where runaway chains live. This rule uses <b>opened</b> only.
          </div>
          <div class="row" style="gap:7px;flex-wrap:wrap">
            <span class="lbl" style="width:46px">Filters</span>
            <span class="chip">branch <b style="color:var(--text);margin-left:3px">main</b></span>
            <span class="chip">paths <b style="color:var(--text);margin-left:3px">any</b></span>
            <button class="btn ghost sm">+ filter</button>
          </div>
        </div>
      </div>

      <div class="bsec"><header><b style="font-size:10px;letter-spacing:.09em;color:var(--accent)">IF</b><span class="t3" style="font-size:11.5px">conditions, no expression language</span></header>
        <div class="bd">
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <select class="f"><option>PR author</option><option>Files changed</option><option>Base branch</option><option>Labels</option><option>PR body</option></select>
            <select class="f"><option>(text) is an agent</option><option>(text) contains</option><option>(text) equals</option></select>
            <input class="f" value="" placeholder="—" style="width:120px" disabled>
          </div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <select class="f"><option>Files changed</option></select>
            <select class="f"><option>(number) less than</option><option>(number) greater than</option></select>
            <input class="f mono" value="400" style="width:80px">
          </div>
          <div class="row" style="gap:12px">
            <button class="btn ghost sm">+ And</button>
            <button class="btn sm">Add Or group</button>
            <span class="t3" style="font-size:11px">Or is a heavier button on purpose — it is rarer and easier to get wrong.</span>
          </div>
        </div>
      </div>

      <div class="bsec"><header><b style="font-size:10px;letter-spacing:.09em;color:var(--ok)">THEN</b></header>
        <div class="bd">
          <div class="row" style="gap:7px;flex-wrap:wrap">
            <select class="f"><option>Run an agent</option><option>Create a ticket in Triage</option><option>Move a ticket</option><option>Post a comment</option><option>Send a notification</option></select>
            <select class="f"><option>Reviewer</option><option>Dev</option><option>Docs</option><option>Architect</option></select>
          </div>
          <input class="f" style="width:100%" value="Review PR {{pr.number}} against the acceptance criteria on {{ticket.key}}.">
          <span class="t3" style="font-size:11px">Interpolation only. Never control flow inside a string.</span>
        </div>
      </div>

      <div class="bsec"><header><span class="lbl">Loop protection</span><span class="t3" style="font-size:11.5px">all five on by default</span></header>
        <div class="bd" style="gap:0">
          ${guards.map(([n,on,d])=>`<div class="guard">
            <span class="toggle ${on?'on':''}" style="margin-top:2px"><i></i></span>
            <span class="col" style="gap:1px"><b style="font-size:12.5px;font-weight:600">${esc(n)}</b><span class="t3" style="font-size:11.5px">${d}</span></span>
          </div>`).join('')}
          <div class="guard"><span style="width:30px;text-align:center;color:var(--text-3)">⌦</span>
            <span class="col" style="gap:1px"><b style="font-size:12.5px;font-weight:600">Escape token</b>
            <span class="t3" style="font-size:11.5px">A PR body containing <span class="mono">skip-agents</span> is ignored by every trigger on this project.</span></span></div>
        </div>
      </div>

      <div class="bsec" style="border-color:var(--border-strong)">
        <header><span class="lbl">Backtest</span><div class="grow"></div><button class="btn sm primary">Run backtest</button></header>
        <div class="bd">
          <div class="row"><span class="st st-completed"><span class="g">✓</span></span><b style="font-size:12.5px">This rule would have fired 7 times in the last 7 days.</b></div>
          <div class="card" style="padding:0;overflow:hidden">
            ${[['PR #219 opened','Aug 21, 09:12','would run Reviewer','ok'],
               ['PR #221 opened','Aug 20, 16:40','would run Reviewer','ok'],
               ['PR #220 opened','Aug 20, 11:02','skipped — 612 files changed','noaction'],
               ['PR #218 ready_for_review','Aug 19, 14:20','would run Reviewer','ok'],
               ['PR #217 opened','Aug 19, 09:55','skipped — author is human','noaction']].map(([e,d,r,k],i)=>`
              <div class="row" style="padding:6px 11px;${i?'border-top:1px solid var(--border)':''}">
                <span class="mono t2" style="width:190px;font-size:11px">${esc(e)}</span>
                <span class="t3 mono" style="width:120px;font-size:11px">${esc(d)}</span>
                <span class="${k==='ok'?'t2':'t3'}" style="font-size:11.5px">${esc(r)}</span>
              </div>`).join('')}
          </div>
          <span class="t3" style="font-size:11px">Replays the project's real event history against the rule as written. Nothing is executed.</span>
        </div>
      </div>
    </div>
  </div>`;
}

function vSettings(){
  const secs = [
    ['General','Name, key prefix, description, colour, archive'],
    ['Board','Columns and their categories, WIP limits, auto-start, default view'],
    ['Wiki','Default agent scope, verification period, repo sync path, context threshold'],
    ['Repository','Repo, default branch, branch template, setup script, secrets, network policy'],
    ['Agents','Project-wide guidance, per-agent defaults'],
    ['Triggers','Rules and the trigger audit log'],
    ['Members & access','Roles, invites, which identity an agent acts as'],
    ['Notifications','Who gets pinged on needs-input and failed'],
    ['Danger zone','Transfer, archive, delete']
  ];
  return `<div class="body" style="max-width:840px">
    <h2 style="margin:0 0 14px;font-size:15px">Project settings</h2>
    <div class="grid2" style="margin-bottom:16px">
      ${secs.map(([n,d])=>`<div class="card pad" style="padding:12px 14px;cursor:pointer">
        <div style="font-size:13px;font-weight:500;margin-bottom:3px;${n==='Danger zone'?'color:var(--fail)':''}">${esc(n)}</div>
        <div class="t3" style="font-size:11.5px;line-height:1.5">${esc(d)}</div>
      </div>`).join('')}
    </div>
    <div class="bsec"><header><span class="lbl">Repository</span><span class="t3" style="font-size:11px">autosaved</span></header><div class="bd">
      ${[['Repository','acme/payments-svc'],['Default branch','main'],['Branch template','{agent}/{ticket-key}-{slug}']].map(([k,v])=>`
        <div class="row"><span class="lbl" style="width:130px">${k}</span><input class="f mono grow" value="${esc(v)}"></div>`).join('')}
      <div class="row"><span class="lbl" style="width:130px">Network policy</span>
        <div class="row" style="gap:2px"><button class="btn sm">None</button><button class="btn sm primary">Allow-list</button><button class="btn sm">Open</button></div>
        <span class="t3" style="font-size:11px">6 hosts</span></div>
      <div class="row"><span class="lbl" style="width:130px">Daily ceiling</span><input class="f mono" value="$120" style="width:90px">
        <span class="t3" style="font-size:11px">Inherited from workspace: <span class="mono">$100</span>. <a href="#" onclick="return false">Reset to default</a></span></div>
      <div class="note">Every project setting with a workspace default shows the inherited value inline rather than hiding it. That one pattern removes most settings confusion in tools shaped like this.</div>
    </div></div>
  </div>`;
}

/* ---------- sheets ---------- */
function sheet(){
  if(!S.sheet) return '';
  let inner = '';
  if(S.sheet==='keys'){
    const K = [['⌘K','command palette'],['⌘J','ask an agent'],['/','search'],['?','shortcuts'],
      ['G then B','board'],['G then W','wiki'],['G then R','runs'],['G then A','agents'],
      ['G then T','triage'],['G then I','inbox'],['C','new ticket'],['⌘⇧O','sub-ticket'],
      ['J / K','move'],['Space','peek'],['S','status'],['P','priority'],
      ['A','assign to a human'],['D','delegate to an agent'],['L','labels'],['E','edit'],
      ['⌘B','board / list'],['⇧V','display options'],['f','next failure in a log'],['1 2 3 H','triage actions']];
    inner = `<div class="pad"><div class="row" style="margin-bottom:12px"><b>Keyboard</b><div class="grow"></div><button class="btn ghost sm" data-act="closesheet">✕</button></div>
      <div class="klist">${K.map(([k,d])=>`<div>${esc(d)}<span class="kbd">${esc(k)}</span></div>`).join('')}</div>
      <div class="note" style="margin-top:14px"><span class="kbd">D</span> for delegate sitting beside <span class="kbd">A</span> for assign is the keyboard-level expression of the two-field model. It restates the product's thesis every time someone presses it.</div></div>`;
  } else if(S.sheet==='cmd'){
    inner = `<div class="pad" style="padding:0">
      <div class="row" style="padding:12px 14px;border-bottom:1px solid var(--border)"><span class="t3">⌕</span><input class="f grow" style="border:0;background:transparent" placeholder="Type a command or search…" autofocus><button class="btn ghost sm" data-act="closesheet">Esc</button></div>
      ${[['Delegate PAY-26 to…','⌘K'],['Run agent on the current ticket',''],['Go to Board','G B'],['New trigger from template',''],['Open run #494',''],['Search the wiki for “idempotency”','']].map((x,i)=>`
        <div class="row" style="padding:9px 14px;${i?'border-top:1px solid var(--border)':''};${i===0?'background:var(--surface-2)':''}"><span style="font-size:12.5px">${esc(x[0])}</span><div class="grow"></div><span class="kbd">${esc(x[1])}</span></div>`).join('')}
      <div class="row" style="padding:8px 14px;border-top:1px solid var(--border)"><span class="t3" style="font-size:11px">⌘K is deterministic actions. ⌘J talks to an agent. Two palettes, on purpose.</span></div>
    </div>`;
  } else {
    inner = `<div class="pad">
      <div class="row" style="margin-bottom:14px"><b>New project</b><div class="grow"></div><button class="btn ghost sm" data-act="closesheet">✕</button></div>
      <div class="empty" style="margin:20px auto 8px">
        <h3>Connect a repository to get started</h3>
        <p class="t3" style="margin:0;font-size:12px;line-height:1.6">We'll import your issues, docs and agent instructions automatically.</p>
        <button class="btn primary" style="margin-top:8px">Connect GitHub repo</button>
        <a href="#" onclick="return false" style="font-size:12px">Start from a template</a>
      </div>
      <div class="note">One gate, everything else dimmed. On connect the empty state becomes a loading state: issues import, detected <span class="mono">AGENTS.md</span> and <span class="mono">CLAUDE.md</span> seed wiki pages at the right scope, two triggers arrive pre-filled and switched off, and the Overview is written from the README.</div>
    </div>`;
  }
  return `<div class="overlay" data-act="closesheet"><div class="sheet" onclick="event.stopPropagation()">${inner}</div></div>`;
}

/* ============================================================
   Render + events
   ============================================================ */
const VIEWS = {home:vHome, inbox:vInbox, overview:vOverview, board:vBoard, ticket:vTicket,
  triage:vTriage, wiki:vWiki, runs:vRuns, run:vRun, agents:vAgents, agent:vAgent,
  triggers:vTriggers, trigger:vTrigger, settings:vSettings};

function render(){
  const inProject = PROJ_VIEWS.includes(S.view);
  $('#app').innerHTML = topbar() + `<div class="main">` + rail() +
    `<div class="pane">${inProject ? projHeader() : ''}${(VIEWS[S.view]||vHome)()}</div>` +
    `</div>` + sheet();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act, k = el.dataset.k, v = el.dataset.v;
  if(a==='go') go(v);
  else if(a==='proj') go('overview', {proj:k});
  else if(a==='ticket') go('ticket', {ticket:k});
  else if(a==='run') go('run', {run:+k, step:5});
  else if(a==='page') go('wiki', {page:k});
  else if(a==='agent') go('agent', {agent:k});
  else if(a==='trigger') go('trigger', {trig:k});
  else if(a==='step'){ S.step = +k; render(); }
  else if(a==='verb'){ S.verbosity = k; render(); }
  else if(a==='layout'){ S.boardLayout = k; render(); }
  else if(a==='sheet'){ S.sheet = el.dataset.s; render(); }
  else if(a==='closesheet'){ S.sheet = null; render(); }
  else if(a==='theme'){
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='light' ? 'dark' : 'light');
  }
  else if(a==='open-needs'){
    if(k==='PAY-23') go('run', {run:492});
    else if(k==='WEB-3') go('overview', {proj:'WEB'});
    else go('ticket', {ticket:k, proj:'PAY'});
  }
});

let goPrefix = false;
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(e.key==='Escape'){ if(S.sheet){ S.sheet=null; render(); } return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); S.sheet='cmd'; render(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='?'){ S.sheet='keys'; render(); return; }
  if(e.key.toLowerCase()==='g'){ goPrefix = true; setTimeout(()=>goPrefix=false, 1400); return; }
  if(goPrefix){
    goPrefix = false;
    const m = {b:'board', w:'wiki', r:'runs', a:'agents', t:'triage', s:'settings', h:'home', i:'inbox', g:'triggers'};
    const v = m[e.key.toLowerCase()];
    if(v) go(v);
  }
});

render();
</script>
