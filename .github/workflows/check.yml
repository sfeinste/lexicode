name: check

on:
  push:
    branches: [main]
  pull_request:
    # `opened` is the criterion; the rest keep the result honest as the PR moves.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          # make check runs golangci-lint itself; this step only installs it.
          install-mode: binary
          args: --version

      - run: make check

  # The Docker sandbox acceptance suite (story S17): real containers against the runner's
  # daemon, so Linux only. Run it locally with: go test -tags docker ./internal/module/docker/
  docker-sandbox:
    name: docker-tagged tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -tags docker -timeout 30m -v ./internal/module/docker/

  # The single gate branch protection requires. It exists because the jobs above fan out over a
  # matrix, so their check names vary; this one does not. It is red unless every test job is green,
  # including when one is skipped or cancelled.
  tests-passed:
    name: tests passed
    runs-on: ubuntu-latest
    needs: [check, docker-sandbox]
    if: always()
    steps:
      - name: Fail if any test job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required test job finished with '$result'"
              exit 1
            fi
          done
