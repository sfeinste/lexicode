name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          # make check runs golangci-lint itself; this step only installs it.
          install-mode: binary
          args: --version

      - run: make check

  # The one status check branch protection requires (.github/rulesets/main.json). It exists so
  # the required context has a single stable name: `needs.check.result` is `success` only when
  # every leg of the matrix passed, so adding an OS here never leaves a required check dangling.
  required:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Fail unless every check job succeeded
        run: |
          echo "check: ${{ needs.check.result }}"
          [[ "${{ needs.check.result }}" == "success" ]]

  # The Docker sandbox acceptance suite (story S17): real containers against the runner's
  # daemon, so Linux only. Best-effort — the first run builds the agent base image, which
  # depends on external downloads (nodejs.org, npm), so a transient failure here must not
  # block the check job. Run it locally with: go test -tags docker ./internal/module/docker/
  docker-sandbox:
    name: docker-tagged tests (linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -tags docker -timeout 30m -v ./internal/module/docker/
