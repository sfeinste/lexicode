name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `make check` runs golangci-lint itself, so CI and a laptop run the identical command
      # and can never disagree about what lint means. This step therefore only has to put the
      # pinned binary on PATH.
      #
      # golangci-lint-action cannot do that: it has no install-only input (v8 takes version,
      # install-mode, working-directory, github-token, verify, only-new-issues, skip-cache,
      # skip-save-cache, problem-matchers, args, cache-invalidation-interval) and always ends
      # by running `golangci-lint run <args>`. The `args: --version` this replaces was an
      # attempt to make that run a no-op; v2's `run` has no --version flag, so the step
      # errored ("unknown flag: --version", exit 3) before `make check` was ever reached.
      #
      # This is the upstream-documented pinned binary install
      # (https://golangci-lint.run/docs/welcome/install/local/), which the project also
      # documents in preference to `go install`.
      - name: install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.13.1
        run: |
          set -euo pipefail
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" version

      - run: make check

  # The Docker sandbox acceptance suite (story S17): real containers against the runner's
  # daemon, so Linux only. Best-effort — the first run builds the agent base image, which
  # depends on external downloads (nodejs.org, npm), so a transient failure here must not
  # block the check job. Run it locally with: go test -tags docker ./internal/module/docker/
  docker-sandbox:
    name: docker-tagged tests (linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -tags docker -timeout 30m -v ./internal/module/docker/
