# Lexicode HTTP API v1 — the endpoints that exist TODAY (through story S16).
#
# This file is the source of truth for request/response shapes (contracts §5). The frontend's
# TypeScript types are generated from it: `make api-types` regenerates
# web/src/lib/api/types.gen.ts, and `make check` fails if the committed file is stale.
#
# Grow this file in the story that adds the route — never ahead of it.
openapi: 3.1.0
info:
  title: Lexicode API
  version: "1"
  description: >
    JSON over cookie-session auth. Every error is application/problem+json with a stable
    `type` slug the frontend switches on (architecture §14). While the database has zero
    users, every call except POST /auth/setup answers 401 `setup_required`.
servers:
  - url: /api/v1
paths:
  /auth/setup:
    post:
      operationId: authSetup
      summary: First-run owner creation. 409 `already_setup` once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Owner created and signed in (session cookie set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      operationId: authLogin
      summary: Sign in with email and password. 401 `invalid_credentials` on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in (session cookie set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session. Idempotent.
      responses:
        "204":
          description: Session revoked and cookie cleared.
  /auth/me:
    get:
      operationId: authMe
      summary: The signed-in user. 401 `unauthenticated` or `session_expired` otherwise.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
  /invites:
    post:
      operationId: createInvite
      summary: Mint a one-time invite link (owner only). The raw token appears here once.
      responses:
        "201":
          description: The copyable invite path and its expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /invites/{token}/redeem:
    post:
      operationId: redeemInvite
      summary: >
        Join via an invite link. 404 `invite_invalid` for an unknown or used token,
        410 `invite_expired` past expiry, 409 `email_taken`.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "201":
          description: Member created and signed in (session cookie set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /users:
    get:
      operationId: listUsers
      summary: >
        The member directory (S12): every non-archived user's public display identity —
        the assignee picker and `@` mention autocomplete read this. Any signed-in user;
        no email, role or credential material crosses the wire.
      responses:
        "200":
          description: Every non-archived user, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /system/modules:
    get:
      operationId: systemModules
      summary: Registered modules and their post-boot state.
      responses:
        "200":
          description: The module list. Empty list, never null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModulesResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects:
    get:
      operationId: listProjects
      summary: >
        Projects with Home-table stats (UI spec §5.1), oldest first. Archived projects are
        excluded unless ?archived=1.
      parameters:
        - name: archived
          in: query
          schema: { type: string, enum: ["1", "true"] }
          description: Include archived projects.
      responses:
        "200":
          description: The project list. Empty list, never null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      summary: >
        Create a project; the caller becomes owner and first member. A duplicate or malformed
        key is a 400 `validation_failed` problem naming the `key` field. Settings columns start
        null (inherit from workspace); board columns arrive with S09.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects/{key}:
    get:
      operationId: getProject
      summary: One project, with its settings resolved against the workspace defaults.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      summary: >
        Patch a project. Absent fields are unchanged. The inheritable settings
        (daily_budget_cents, context_threshold_tokens, verification_days) are tri-state:
        a number overrides the workspace default, an explicit null reverts to inherit.
        `archived` true/false archives and unarchives.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/overview:
    get:
      operationId: projectOverview
      summary: >
        The Overview About card (UI spec §5.2) — the fields that exist through S08. `repo` is
        null until a repository is connected (S14); recent runs, pinned pages and the activity
        feed arrive with their stories.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The About card data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectOverview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/secrets:
    get:
      operationId: listProjectSecrets
      summary: >
        A project's secrets — names and dates only. Secret values are write-only through the
        API (D-16): no route ever returns one.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The secret list, name order. Metadata only, never values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setProjectSecret
      summary: >
        Set a secret: create it, or replace the value of the existing secret with this name.
        The one shape a value ever crosses the API in — requests only, never responses.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSecretRequest" }
      responses:
        "200":
          description: The value of the existing secret with this name was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: A new secret was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/secrets/{id}:
    patch:
      operationId: renameProjectSecret
      summary: Rename a secret. The stored value is untouched.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameSecretRequest" }
      responses:
        "200":
          description: The renamed secret's metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProjectSecret
      summary: >
        Delete a secret. A secret something still references (a connected repo's token)
        answers 409 secret_in_use rather than orphaning the reference.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/repo:
    post:
      operationId: connectRepo
      summary: >
        Connect a GitHub repository (S15): verify owner/name + PAT against the forge, store
        the token as the project's GITHUB_TOKEN secret (write-only, D-16) and persist the
        repos row with the default branch and head commit for the About card. Reconnecting
        replaces the token and refreshes the row.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepoRequest" }
      responses:
        "201":
          description: The connected repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      operationId: repoStatus
      summary: The project's repo connection. `connected:false` is a normal state, not a 404.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Whether a repository is connected, and which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: disconnectRepo
      summary: >
        Disconnect the repository and delete the stored token. Everything a bootstrap
        imported — tickets, wiki pages, triggers, agents — stays with the project.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/repo/network:
    patch:
      operationId: updateRepoNetwork
      summary: >
        Update the repo's network policy and allowlist (S18, D-10). network_policy null
        reverts to inheriting the workspace default; an absent field is left unchanged.
        The egress proxy enforces the result per run; every allow/deny lands in the run's
        verbose activities.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepoNetworkRequest" }
      responses:
        "200":
          description: The repo with its updated network settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/bootstrap/preview:
    post:
      operationId: bootstrapPreview
      summary: >
        The bootstrap checklist in one payload (brief §6.3): open issues checked by default,
        detected instruction docs with proposed agent_scope (D-11), detected CI as two
        pre-filled triggers whose toggles are OFF, suggested starter agents, and an Overview
        draft from the README. Writes nothing. Previously imported items (matched on issue
        number / doc path) come back unchecked and labeled.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The checklist payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapPreview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/bootstrap/apply:
    post:
      operationId: bootstrapApply
      summary: >
        Create exactly the checked subset: tickets from issues (origin `import`), live wiki
        pages from docs, the suggested triggers DISABLED, the starter agents, the project
        description. Already-imported items are skipped, never duplicated.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapApplyRequest" }
      responses:
        "200":
          description: What was created and what was skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/agents:
    get:
      operationId: listAgents
      summary: >
        A project's agent roster, oldest first, with per-card run stats (runs and spend over a
        rolling seven days, success rate over the agent's ended history — all zeros until runs
        exist). `?eligible=1` narrows to delegate-eligible agents: enabled and not archived —
        the list behind delegate pickers and mention autocomplete.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - name: eligible
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", only enabled, non-archived agents.
      responses:
        "200":
          description: The roster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgent
      summary: >
        Create an agent. Git identity defaults from the name (D-9's
        `Reviewer <reviewer@agents.lexicode.local>` pattern); a version-1 directive (possibly
        empty) is written in the same transaction. A duplicate name in the project is a 409
        `agent_name_taken` whose errors array names the `name` field.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRequest" }
      responses:
        "201":
          description: The created agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/agents/starter:
    post:
      operationId: createStarterRoster
      summary: >
        Create the starter roster — the same Dev and Reviewer pair the repository bootstrap
        suggests (shared code, so the two paths cannot drift). Names that already exist are
        skipped, never duplicated.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The names created (possibly empty when both already exist).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarterRosterResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{id}:
    get:
      operationId: getAgent
      summary: One agent with stats. Disabled and archived agents stay fetchable — history is kept.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAgent
      summary: >
        Patch an agent: identity, model & effort, typed permissions (replaced wholesale —
        enforcement config, never raw JSON), autonomy, limits, enable/disable. Absent fields
        are unchanged; `daily_cap_cents: null` clears the cap (inherit the project default).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: The updated agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: archiveAgent
      summary: >
        Archive the agent (D-15 soft delete): stamps archived_at and disables it. Runs,
        directive versions and mentions stay readable. Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Archived.
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{id}/directive:
    put:
      operationId: saveDirective
      summary: >
        Save the directive. Append-only versioning with a no-op guard: an unchanged body
        writes nothing and answers 200 with the current version (`created: false`); a changed
        body appends the next version and answers 201. Token estimate is the documented
        chars/4 heuristic. (POST /agents/{id}/directives is the same operation.)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDirectiveRequest" }
      responses:
        "200":
          description: "Unchanged body — the current version, created: false."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveDirectiveResponse" }
        "201":
          description: New version appended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveDirectiveResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{id}/directive/estimate:
    post:
      operationId: estimateDirectiveTokens
      summary: >
        Live token estimate for an unsaved directive body — the same chars/4 heuristic that
        stamps saved versions, computed server-side.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateRequest" }
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstimateResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{id}/directives:
    get:
      operationId: listDirectives
      summary: >
        The directive version list, newest first, bodies included — the diff view compares any
        two versions without another fetch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: All versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectiveListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: appendDirective
      summary: The contracts-inventory spelling of PUT /agents/{id}/directive — same operation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDirectiveRequest" }
      responses:
        "200":
          description: "Unchanged body — the current version, created: false."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveDirectiveResponse" }
        "201":
          description: New version appended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveDirectiveResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{id}/directives/{version}:
    get:
      operationId: getDirectiveVersion
      summary: One directive version's full content.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directive" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/columns:
    get:
      operationId: listColumns
      summary: >
        A project's board columns in board order, with ticket counts. Names are display
        strings; automation keys off `category` (plan rule 3), never the name.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The column list. Every project has at least backlog, running and done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColumnListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createColumn
      summary: >
        Add a column at the end of the board. Category is chosen at creation (and editable
        later) — it is what automation reads.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateColumnRequest" }
      responses:
        "201":
          description: The created column.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /columns/{id}:
    patch:
      operationId: updateColumn
      summary: >
        Patch a column: rename, category, WIP limit (null clears), auto_start_delegate,
        reorder via `after_id` (null = move to the front, a column id = place after it).
        Changing the category of the project's last backlog/running/done column is a 409
        `last_category_column` problem naming the category.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateColumnRequest" }
      responses:
        "200":
          description: The updated column.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteColumn
      summary: >
        Delete a column. If it holds tickets, `destination_column_id` names the column that
        receives them (same board, not the column itself) and the move happens in the delete's
        transaction; omitting it is a 400 `validation_failed` naming the field. Deleting the
        project's last backlog/running/done column is a 409 `last_category_column` problem
        naming the category.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: destination_column_id
          in: query
          schema: { type: string }
          description: Where the column's tickets go. Required when the column holds tickets.
      responses:
        "204": { description: Deleted (and tickets moved, when a destination was given). }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/tickets:
    get:
      operationId: listTickets
      summary: >
        A project's tickets in board order (column, then fractional position). Archived
        tickets are hidden unless `archived=1`. Each ticket's `category` is derived from its
        column — status is never stored and never a column name (plan rule 3).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - name: archived
          in: query
          schema: { type: string, enum: ["1"] }
          description: Include archived tickets.
      responses:
        "200":
          description: The ticket list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: >
        Create a ticket. The key (PAY-14) is allocated atomically from the project's sequence
        inside the insert transaction — two concurrent creates never collide. Omitting
        `column_id` lands the ticket in the first backlog-category column. Nesting under a
        ticket that is itself a sub-ticket is a 409 `subticket_depth` problem.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTicketRequest" }
      responses:
        "201":
          description: The created ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}:
    get:
      operationId: getTicket
      summary: One ticket with its acceptance criteria, labels and sub-tickets.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ticket detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTicket
      summary: >
        Patch a ticket. `assignee_id` (human, D1) and `delegate_agent_id` (agent, D1) accept
        an explicit null to clear; `parent_id` null detaches a sub-ticket. Mutating an
        archived ticket is a 409 `ticket_archived`; violating the one-level sub-ticket rule
        is a 409 `subticket_depth`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTicketRequest" }
      responses:
        "200":
          description: The updated ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: archiveTicket
      summary: >
        Archive (soft delete, D-15): archived_at is stamped, active runs are cancelled with
        reason "ticket archived", history is kept, unarchive restores. `confirm_active_runs`
        must equal the ticket's current active-run count (default 0); a mismatch is a 409
        `active_runs_confirmation` naming the real count.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: confirm_active_runs
          in: query
          schema: { type: integer, minimum: 0 }
          description: How many active runs the caller confirms will be cancelled.
      responses:
        "204": { description: Archived. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/unarchive:
    post:
      operationId: unarchiveTicket
      summary: Restore an archived ticket. 409 `ticket_not_archived` when it is not archived.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The restored ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/move:
    post:
      operationId: moveTicket
      summary: >
        Move a ticket to a column at a fractional position. Send either an explicit
        `position` (a client that computed the midpoint itself) or `after_ticket_id` (null =
        top of the column, a ticket id = right after it, absent = end) and the server
        computes the true float midpoint, renormalising the column when midpoints are
        exhausted. A move NEVER starts a run (brief D3): when the destination column has
        auto_start_delegate and the ticket has a delegate, the intent goes through the run
        scheduler — audited, and a no-op until S22.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveTicketRequest" }
      responses:
        "200":
          description: The moved ticket, with its server-assigned position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/subtickets:
    post:
      operationId: createSubtickets
      summary: >
        Create one sub-ticket per title, atomically, in the parent's column — the backing
        endpoint for selection→sub-tickets. One level only: calling this on a sub-ticket is
        a 409 `subticket_depth`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubticketsRequest" }
      responses:
        "201":
          description: The created sub-tickets, in input order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketListResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/stream:
    get:
      operationId: getTicketStream
      summary: >
        The unified ticket stream, oldest first — one chronological history, no
        Comments/Activity split (data model §4.1).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Every stream entry for the ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketStreamResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createComment
      summary: >
        Append a comment to the stream (S12): one kind='comment' row with the markdown body
        and actor attribution. `@[label](kind:id)` mention tokens in the body are parsed
        into the mentions table; each distinct mentioned agent stages a run request through
        the scheduler seam — `run_requests` reports the honest outcome per agent (staged is
        false with an explanatory note until the S22 scheduler exists). 409
        `ticket_archived` on an archived ticket.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: The created stream entry and any agent-mention run request outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/delegate:
    post:
      operationId: delegateTicket
      summary: >
        Delegate the ticket to an agent (S22): records the agent as the ticket's delegate and
        enqueues a run through the kernel scheduler (D-14). A nil error means "queued", not
        "running" — admission control (§10.2) decides when it starts, and the run's
        `hold_reason` says in words which limit is holding it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegateRequest" }
      responses:
        "201":
          description: The created run's id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegateResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/criteria:
    post:
      operationId: addCriterion
      summary: Append one acceptance criterion to the ticket's ordered checklist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCriterionRequest" }
      responses:
        "201":
          description: The created criterion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /criteria/{id}:
    patch:
      operationId: updateCriterion
      summary: >
        Patch a criterion: text, note, checked (a human check records the acting user;
        checked_by_run_id is written by agent runs from S22), and reorder via `after_id`
        (null = top, a criterion id = right after it).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCriterionRequest" }
      responses:
        "200":
          description: The updated criterion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCriterion
      summary: Remove a criterion from its ticket's checklist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/labels:
    get:
      operationId: listLabels
      summary: A project's labels, sorted by name. Labels are project-scoped.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The label list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createLabel
      summary: >
        Create a label with a #rrggbb colour. A duplicate name within the project is a
        field-level 400.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabelRequest" }
      responses:
        "201":
          description: The created label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /labels/{id}:
    patch:
      operationId: updateLabel
      summary: Rename or recolour a label; every ticket wearing it follows.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLabelRequest" }
      responses:
        "200":
          description: The updated label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLabel
      summary: Delete a label, detaching it from every ticket in the same transaction.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted and detached everywhere. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/labels/{label_id}:
    put:
      operationId: attachLabel
      summary: Put a label on a ticket. Idempotent — attaching twice is a no-op.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: label_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Attached (or already attached). }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: detachLabel
      summary: Take a label off a ticket. Idempotent — detaching twice is a no-op.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: label_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Detached (or was not attached). }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/triage:
    get:
      operationId: listTriage
      summary: >
        The S31 triage queue: a project's unresolved triage items — `pending` first, then
        `snoozed`, each oldest first — with their tickets and the verbatim provenance line
        every row renders. `pending_count` is the triage tab badge: actionable items only,
        snoozed items never count (UI spec §2.1).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /triage/{id}/accept:
    post:
      operationId: acceptTriage
      summary: >
        Resolve an item `accepted`. The ticket does not move — it was created into the
        project's first backlog-category column (S28) and accepting simply ends the §10.7
        board exclusion: the next board query shows it there. A verb on an already-resolved
        item is a 409 `triage_resolved`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The resolved item with its (now board-visible) ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageItem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /triage/{id}/duplicate:
    post:
      operationId: duplicateTriage
      summary: >
        Resolve an item `duplicate`, merging its ticket into `of_ticket_id` (the survivor).
        Transfers to the survivor: the duplicate's labels (deduplicated), its acceptance
        criteria (appended after the survivor's own, checked state kept), every mention that
        pointed at the duplicate (redirected), and a stream note carrying the duplicate's
        key and its full provenance line — one ticket ends up with both provenances. The
        duplicate ticket is archived with the merge recorded in its stream. Not
        transferred: the duplicate's stream history, description, priority, assignee,
        delegate. The survivor must be an unarchived ticket of the same project and not
        itself awaiting triage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageDuplicateRequest" }
      responses:
        "200":
          description: The resolved item; its ticket is the archived duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /triage/{id}/decline:
    post:
      operationId: declineTriage
      summary: >
        Resolve an item `declined`: the ticket is archived (canceled, D-15 soft delete) and
        the optional reason lands on the item and in the ticket stream.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageDeclineRequest" }
      responses:
        "200":
          description: The resolved item with its archived ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /triage/{id}/snooze:
    post:
      operationId: snoozeTriage
      summary: >
        Park an item — NOT a resolution; the ticket stays off the board (§10.7). `until` an
        RFC3339 instant = time-based, woken by a server ticker when it passes; `until` null
        (or absent) = until new activity, woken when an event's subject matches the ticket:
        the event's subject IS the ticket, or its subject number equals the ticket's linked
        PR number, or its subject branch equals the ticket's branch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageSnoozeRequest" }
      responses:
        "200":
          description: The snoozed item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{id}/permission-rules:
    get:
      operationId: listPermissionRules
      summary: >
        The agent's permission rules — what "always allow" writes (interaction rule 8).
        Evaluated by the MCP server before autonomy, in creation order, first match wins.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The agent's rules, creation order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionRuleList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{id}/permission-rules/{rule_id}:
    delete:
      operationId: deletePermissionRule
      summary: Remove one permission rule.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rule_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/triggers:
    get:
      operationId: listTriggers
      summary: >
        The project's triggers, oldest first, each with its rule-health aggregate: per-outcome
        counts over the last 50 firings, never collapsed to success/failure.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The triggers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTrigger
      summary: >
        Create a trigger. The event kind and activity types must exist in the stored source's
        catalog; the condition tree must use contracts §4.1 operators over syntactically valid
        payload paths; registered action IDs get their params validated, unregistered IDs are
        stored and fire as `errored` until their module ships. Defaults: enabled, source
        github.poll, `{"all":[]}` conditions, no actions, the §6.1 loop config.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerInput" }
      responses:
        "201":
          description: The created trigger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trigger" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /triggers/{id}:
    get:
      operationId: getTrigger
      summary: One trigger with its rule-health aggregate.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The trigger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trigger" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTrigger
      summary: >
        Patch a trigger. Absent fields are unchanged; the merged row is re-validated whole.
        `enabled: false` makes the engine skip it entirely — no evaluation, no firing rows.
        `cron: ""` clears the cron expression.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerInput" }
      responses:
        "200":
          description: The updated trigger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trigger" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTrigger
      summary: >
        Delete the trigger and its firing history. A trigger that runs or tickets still
        reference answers 409 `trigger_in_use` — disable it instead; history is kept.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /triggers/{id}/firings:
    get:
      operationId: listTriggerFirings
      summary: >
        The trigger's firing history, newest first — every terminal outcome of the pipeline,
        including `no_action`, each with its reason in words and any interpolation warnings.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
          description: At most this many rows (default 50).
      responses:
        "200":
          description: The firings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerFiringListResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /triggers/{id}/backtest:
    post:
      operationId: backtestTrigger
      summary: >
        Replay the project's stored event history (D-13) through stages 1–2 of the pipeline —
        the same match and condition code the live engine runs — with the guard and actions
        deliberately not simulated; loop protection and budget are evaluated live and may
        reduce the count. An empty (or absent) body backtests the rule as stored; a
        TriggerInput body is an unsaved draft merged over the stored row exactly as PATCH
        would — validated whole, never written. A pure read either way.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: days
          in: query
          schema: { type: integer }
          description: The window in days, clamped to 1..30 (default 7).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerInput" }
      responses:
        "200":
          description: The replay result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/trigger-catalog:
    get:
      operationId: getTriggerCatalog
      summary: >
        The merged trigger-editor catalog (S29): every registered event source's
        Catalog() (WHEN options; each event's `fields` doubles as the IF field vocabulary
        and the {{...}} interpolation picker's list), every registered action's
        {id, label, schema} (THEN options), and the static contracts §4.1 operator table
        (IF operator dropdowns, type-prefixed). The editor is generated from this one
        payload — a new source or action appears with no frontend change.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerCatalog" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/runs:
    get:
      operationId: listRuns
      summary: >
        A project's runs, newest first (S22; the full list UI is S23). `status` accepts a
        comma-separated set of run states. `view=needs_you` (S24) returns the board lane's
        rows instead — the same query the home strip and /inbox render, scoped to one
        project, each row carrying the §4.3 flavor in words.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: agent, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: view, in: query, schema: { type: string, enum: [needs_you] } }
      responses:
        "200":
          description: >
            The matching runs — RunListResponse normally, NeedsYouListResponse when
            `view=needs_you`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunListResponse"
                  - $ref: "#/components/schemas/NeedsYouListResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /runs/{id}:
    get:
      operationId: getRun
      summary: >
        One run, with its outputs and its recorded context stack. A queued run's
        `hold_reason` names, in words, which limit is holding it (§10.2 — never a bare
        spinner).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run, its outputs and its context items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetailResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /runs/{id}/activities:
    get:
      operationId: getRunActivities
      summary: The run's transcript in step order (basic; S23 builds the timeline UI on it).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The transcript.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunActivitiesResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /runs/{id}/chain:
    get:
      operationId: getRunChain
      summary: >
        The run's causal chain (S27, architecture §9): ancestors via runs.cause_event_id,
        descendants via events.cause_run_id, oldest first, the requested run flagged
        `focus`. Reconstructed from the causality edges on demand — never stored — so it is
        available for every run, not only loop-stopped ones. The loop chain view renders it
        vertically with the repeating element highlighted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The chain, oldest entry first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunChainResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /runs/{id}/messages:
    post:
      operationId: steerRun
      summary: >
        Queue a steering message ("queue, don't interrupt"): a run_messages row the
        supervisor delivers between tool calls — "Applied after the current step" is
        literally true (contracts §3.4). Enabled from queued through provisioning and
        running (§10.3). 409 `run_ended` once the run is terminal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SteerRequest" }
      responses:
        "201":
          description: The queued message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runs/{id}/stop:
    post:
      operationId: stopRun
      summary: >
        Stop the run: terminal `canceled` with the reason recorded, after the §10.5
        failure-artifact push — whatever exists is committed and pushed to the run branch
        before the container is destroyed. 409 `run_ended` once the run is terminal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopRunRequest" }
      responses:
        "200":
          description: The stopped run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopRunResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runs/{id}/takeover:
    post:
      operationId: takeoverRun
      summary: >
        Take over the run (architecture §10.7): stop with reason `takeover` (the §10.5
        artifact push preserved), store the note on the run — it is injected into the
        prompt of the next run on the same ticket — and return the copy-paste checkout
        block. 409 `run_ended` once the run is terminal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TakeoverRequest" }
      responses:
        "200":
          description: The taken-over run and the checkout command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TakeoverResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runs/{id}/acknowledge:
    post:
      operationId: acknowledgeRun
      summary: >
        Dismiss a terminal run from the needs-you surfaces (S24). 409 `run_not_ended` while
        the run is still live — a live run needs answering, not dismissing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The acknowledged run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopRunResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /inbox:
    get:
      operationId: getInbox
      summary: >
        The workspace-wide needs-you rows for the caller's projects — the one query behind
        the home strip, the left rail and /inbox (architecture §12). S24 ships the run rows;
        the S36 inbox adds outputs awaiting review.
      responses:
        "200":
          description: The needs-you rows, question → approval → failure, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeedsYouListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /notifications:
    get:
      operationId: listNotifications
      summary: >
        The caller's notifications (non-dismissed, most recently updated first) and the
        unread count the inbox badge renders. One row per run, updated in place — never
        stacked (interaction rule 3).
      responses:
        "200":
          description: The notifications and the unread count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /notifications/{id}/read:
    post:
      operationId: readNotification
      summary: Mark one of the caller's notifications read.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /notifications/{id}/dismiss:
    post:
      operationId: dismissNotification
      summary: Dismiss one of the caller's notifications.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /elicitations/{id}/respond:
    post:
      operationId: respondElicitation
      summary: >
        Answer a blocked run: answer a question, or approve / deny / approve-with-edits /
        remember an approval. `remember` writes exactly one agent permission rule
        (interaction rule 8) and then answers allow. Unblocks the waiting MCP tool call and
        returns the run to `running`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondElicitationRequest" }
      responses:
        "200":
          description: The resolved elicitation (and the remembered rule id, if one was written).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespondElicitationResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workspace/settings:
    get:
      operationId: getWorkspaceSettings
      summary: The single workspace_settings row (owner only).
      responses:
        "200":
          description: The workspace settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateWorkspaceSettings
      summary: >
        Update the workspace settings (owner only). Absent fields are unchanged, so the
        settings screen can autosave one control at a time. Projects whose settings columns
        are null follow the new values immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceSettingsRequest" }
      responses:
        "200":
          description: The updated workspace settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /workspace/secrets:
    get:
      operationId: listWorkspaceSecrets
      summary: >
        Workspace-scope secrets (owner only) — names and dates only, like the project list.
        Values are write-only through the API (D-16).
      responses:
        "200":
          description: The secret list, name order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setWorkspaceSecret
      summary: Set a workspace-scope secret — create, or replace the existing name's value (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSecretRequest" }
      responses:
        "200":
          description: The value of the existing secret with this name was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: A new secret was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /workspace/secrets/{id}:
    patch:
      operationId: renameWorkspaceSecret
      summary: Rename a workspace-scope secret (owner only). The stored value is untouched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameSecretRequest" }
      responses:
        "200":
          description: The renamed secret's metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorkspaceSecret
      summary: Delete a workspace-scope secret (owner only).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workspace/credentials:
    get:
      operationId: getWorkspaceCredentials
      summary: >
        Credential sources and their health (owner only, D-5). Configuration state and
        actionable health messages — never a token value (D-16).
      responses:
        "200":
          description: The credentials status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /workspace/credentials/oauth-token:
    put:
      operationId: setOAuthToken
      summary: >
        Store the pasted `claude setup-token` output as the workspace credential (owner
        only). The value is write-only; the response is the refreshed status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOAuthTokenRequest" }
      responses:
        "200":
          description: The refreshed credentials status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearOAuthToken
      summary: Forget the stored OAuth token (owner only).
      responses:
        "200":
          description: The refreshed credentials status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workspace/credentials/import:
    post:
      operationId: importOAuthToken
      summary: >
        Import the Claude Code CLI's own stored login from ~/.claude/.credentials.json
        (owner only). Linux only — macOS keeps the login in the system Keychain — and the
        file is read at click time, never per run (D-5). 409 on a non-Linux server; 404 when
        no usable file exists.
      responses:
        "200":
          description: The refreshed credentials status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /audit:
    get:
      operationId: auditList
      summary: Query the audit log (owner only). Keyset-paginated.
      parameters:
        - { name: project, in: query, schema: { type: string }, description: Project key or id. }
        - { name: actor, in: query, schema: { type: string }, description: "`human` or `human:<id>` (later: agent, trigger, system)." }
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string }, description: Target kind. }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of audit entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /stream:
    get:
      operationId: stream
      summary: >
        The SSE stream (contracts §5.1). One connection per tab;
        `?topics=project:PAY,run:01H…,inbox` selects topics. Frames carry `id:` (ULID),
        `event:` (StreamEventType) and `data:` (StreamFrame). `Last-Event-ID` on reconnect
        replays missed frames. Not consumable through fetch — the SPA uses EventSource.
      parameters:
        - name: topics
          in: query
          schema: { type: string }
          description: Comma-separated topic list.
      responses:
        "200":
          description: An event stream; stays open until the client goes away.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: application/problem+json with a stable `type` slug.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 problem details. `type` is a slug, not a URL. Slugs in use today:
        setup_required, already_setup, invalid_credentials, session_expired, unauthenticated,
        forbidden, invite_invalid, invite_expired, email_taken, not_found, invalid_request,
        validation_failed, last_category_column, internal.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    PermissionRule:
      type: object
      required: [id, agent_id, tool, pattern, decision, created_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        tool: { type: string }
        pattern: { type: string }
        decision: { type: string, enum: [allow, deny, ask] }
        created_from_run_id: { type: string }
        created_by: { type: string }
        created_at: { type: string }
    PermissionRuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/PermissionRule" }
    Elicitation:
      type: object
      description: >
        One blocking question or approval a run asked. `request` is the tool's payload —
        for approvals, enriched with the six card fields (action, scope, impact, reason,
        alternatives, recovery).
      required: [id, run_id, kind, state, request, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        activity_seq:
          type: integer
          description: The timeline row this elicitation is anchored to (S24).
        kind: { type: string, enum: [question, approval] }
        state: { type: string, enum: [pending, answered, denied, expired, canceled] }
        request: {}
        response: {}
        responded_by: { type: string }
        responded_at: { type: string }
        created_at: { type: string }
    RespondElicitationRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [answer, approve, deny, approve_with_edits, remember]
        answers:
          type: object
          description: Question answers — question text to selected option labels.
          additionalProperties:
            type: array
            items: { type: string }
        text: { type: string, description: Freeform answer to a question. }
        updated_input:
          type: object
          description: approve_with_edits — the edited tool input the agent proceeds with.
          additionalProperties: true
        message: { type: string, description: Deny message the agent will read. }
        pattern:
          type: string
          description: remember — the rule pattern; derived from the request when omitted.
    RespondElicitationResponse:
      type: object
      required: [elicitation]
      properties:
        elicitation: { $ref: "#/components/schemas/Elicitation" }
        rule_id:
          type: string
          description: The permission rule `remember` wrote, when it did.
    User:
      type: object
      required: [id, email, display_name, role, avatar_color, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [owner, member] }
        avatar_color: { type: string }
        created_at: { type: string, format: date-time }
    SetupRequest:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string }
        display_name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RedeemRequest:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string }
        display_name: { type: string }
        password: { type: string }
    Invite:
      type: object
      required: [path, expires_at]
      properties:
        path:
          type: string
          description: The one-time path (`/invite/<token>`) the owner copies into a message.
        expires_at: { type: string, format: date-time }
    ModulesResponse:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleStatus" }
    ModuleStatus:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string, enum: [ready, degraded] }
        reason: { type: string }
    AuditListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor:
          type: string
          description: Present exactly when the page was full; pass back as ?cursor=.
    AuditEntry:
      type: object
      required: [id, project_id, actor_kind, actor_id, action, target_kind, target_id, before, after, created_at]
      properties:
        id: { type: string }
        project_id: { type: [string, "null"] }
        actor_kind: { type: string }
        actor_id: { type: [string, "null"] }
        action: { type: string }
        target_kind: { type: string }
        target_id: { type: string }
        before: {}
        after: {}
        note: { type: string }
        created_at: { type: string, format: date-time }
    InheritedInt:
      type: object
      description: >
        One inheritable project setting resolved against the workspace default (data model §1):
        `value` is the effective value, `inherited` is whether the project column is null, and
        `workspace_value` is the live workspace default — everything the InheritedField control
        needs without recomputing.
      required: [value, inherited, workspace_value]
      properties:
        value: { type: integer }
        inherited: { type: boolean }
        workspace_value: { type: integer }
    ProjectSettings:
      type: object
      required: [daily_budget_cents, context_threshold_tokens, verification_days]
      properties:
        daily_budget_cents: { $ref: "#/components/schemas/InheritedInt" }
        context_threshold_tokens: { $ref: "#/components/schemas/InheritedInt" }
        verification_days: { $ref: "#/components/schemas/InheritedInt" }
    Project:
      type: object
      required:
        [id, key, name, description, color, owner_id, agent_guidance, archived_at,
         created_at, updated_at, settings]
      properties:
        id: { type: string }
        key: { type: string, description: "Uppercase, 2–10 chars: [A-Z][A-Z0-9]{1,9}." }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        owner_id: { type: string }
        agent_guidance: { type: string }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
    ProjectStats:
      type: object
      description: The Home-table counters (UI spec §5.1).
      required: [open_tickets, running_agents, needs_you, spend_today_cents, last_activity]
      properties:
        open_tickets: { type: integer }
        running_agents: { type: integer }
        needs_you: { type: integer }
        spend_today_cents: { type: integer }
        last_activity: { type: string, format: date-time }
    ProjectListItem:
      allOf:
        - { $ref: "#/components/schemas/Project" }
        - type: object
          required: [stats]
          properties:
            stats: { $ref: "#/components/schemas/ProjectStats" }
    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectListItem" }
    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        color: { type: string, description: "#rrggbb; defaults from a palette when omitted." }
    UpdateProjectRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. The three inheritable settings accept an
        explicit null to revert to inheriting the workspace default.
      properties:
        name: { type: string }
        description: { type: string }
        color: { type: string }
        owner_id: { type: string }
        agent_guidance: { type: string }
        archived: { type: boolean }
        daily_budget_cents: { type: [integer, "null"] }
        context_threshold_tokens: { type: [integer, "null"] }
        verification_days: { type: [integer, "null"] }
    ProjectOverview:
      type: object
      required:
        [project, owner, repo, agent_count, open_tickets, runs_today, spend_today_cents]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        owner: { $ref: "#/components/schemas/ProjectOwner" }
        repo:
          oneOf:
            - $ref: "#/components/schemas/OverviewRepo"
            - type: "null"
          description: Null until a repository is connected (S15).
        agent_count: { type: integer }
        open_tickets: { type: integer }
        runs_today: { type: integer }
        spend_today_cents: { type: integer }
    ProjectOwner:
      type: object
      required: [id, display_name, avatar_color]
      properties:
        id: { type: string }
        display_name: { type: string }
        avatar_color: { type: string }
    OverviewRepo:
      type: object
      description: The About card's repo facts (UI spec §5.2).
      required: [provider, owner, name, default_branch, head_sha, head_message]
      properties:
        provider: { type: string }
        owner: { type: string }
        name: { type: string }
        default_branch: { type: [string, "null"] }
        head_sha: { type: [string, "null"] }
        head_message: { type: [string, "null"] }
    ConnectRepoRequest:
      type: object
      required: [owner, name, token]
      properties:
        owner: { type: string }
        name: { type: string }
        token:
          type: string
          description: A GitHub PAT. Stored write-only as the project secret GITHUB_TOKEN (D-16).
    Repo:
      type: object
      description: A connected repository. The token never appears — only that one is stored.
      required:
        [provider, owner, name, default_branch, head_sha, head_message, connected_at,
         last_synced_at, has_token, network_policy, network_allowlist,
         workspace_network_policy]
      properties:
        provider: { type: string }
        owner: { type: string }
        name: { type: string }
        default_branch: { type: [string, "null"] }
        head_sha: { type: [string, "null"] }
        head_message: { type: [string, "null"] }
        connected_at: { type: [string, "null"] }
        last_synced_at: { type: [string, "null"] }
        has_token: { type: boolean }
        network_policy:
          type: [string, "null"]
          enum: [none, allowlist, open, null]
          description: The project's network policy override (S18, D-10). Null inherits the workspace default.
        network_allowlist:
          type: array
          items: { type: string }
          description: Extra allowed domains under the allowlist policy. `*.example.com` matches the domain and every subdomain.
        workspace_network_policy:
          type: string
          enum: [none, allowlist, open]
          description: The live workspace default, for the settings pane's inheritance line.
    UpdateRepoNetworkRequest:
      type: object
      description: >
        Both fields are optional; an absent field is left unchanged. network_policy null
        reverts to inheriting the workspace default. Allowlist entries are bare domains,
        optionally with a `*.` wildcard prefix — never URLs.
      properties:
        network_policy:
          type: [string, "null"]
          enum: [none, allowlist, open, null]
        network_allowlist:
          type: array
          items: { type: string }
    RepoStatus:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        repo: { $ref: "#/components/schemas/Repo" }
    IssueCandidate:
      type: object
      required: [number, title, body, author_login, labels, url, checked, already_imported]
      properties:
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        author_login: { type: string }
        labels: { type: array, items: { type: string } }
        url: { type: string }
        checked: { type: boolean }
        already_imported: { type: boolean }
        ticket_key: { type: string, description: Set when already imported. }
    DocCandidate:
      type: object
      required: [path, title, proposed_scope, scope_paths, checked, already_imported]
      properties:
        path: { type: string }
        title: { type: string }
        proposed_scope: { $ref: "#/components/schemas/AgentScope" }
        scope_paths: { type: array, items: { type: string } }
        checked: { type: boolean }
        already_imported: { type: boolean }
        page_slug: { type: string, description: Set when already imported. }
    AgentPermissions:
      type: object
      description: >
        The agents.permissions object (data model §3.1). Enforcement, not guidance (brief D7):
        these compile to runtime allow/deny rules and hard refusals, never prompt text. There
        is deliberately no merge permission (brief D6).
      required: [read_files, edit_files, run_commands, push_branches, open_prs, comment_prs,
        submit_reviews, create_wiki_pages]
      properties:
        read_files: { type: boolean }
        edit_files: { type: boolean }
        run_commands: { type: boolean }
        push_branches: { type: boolean }
        open_prs: { type: boolean }
        comment_prs: { type: boolean }
        submit_reviews: { type: boolean }
        create_wiki_pages: { type: boolean }
    AgentAutonomy:
      type: string
      description: The four-stop autonomy dial, ordered by increasing risk.
      enum: [suggest, approve_each, auto_gates, auto]
    Agent:
      type: object
      required: [id, project_id, name, role, color, runtime_id, model, effort, autonomy,
        permissions, git_author_name, git_author_email, forge_login, concurrency_cap,
        daily_cap_cents, max_wall_clock_seconds, max_steps, enabled, directive_version_id,
        archived_at, created_at, updated_at, runs_week, spend_week_cents, success_rate]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        role: { type: string }
        color: { type: string }
        runtime_id: { type: string }
        model:
          type: string
          description: One of claude-opus-5, claude-sonnet-5, claude-haiku-4-5.
        effort: { type: string, description: "Thinking effort: low, medium or high." }
        autonomy: { $ref: "#/components/schemas/AgentAutonomy" }
        permissions: { $ref: "#/components/schemas/AgentPermissions" }
        git_author_name: { type: string }
        git_author_email: { type: string }
        forge_login: { type: [string, "null"] }
        concurrency_cap: { type: integer }
        daily_cap_cents:
          type: [integer, "null"]
          description: Null inherits the project/workspace default.
        max_wall_clock_seconds: { type: integer }
        max_steps: { type: integer }
        enabled: { type: boolean }
        directive_version_id: { type: [string, "null"] }
        archived_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
        runs_week: { type: integer, description: Runs queued in the last seven days. }
        spend_week_cents: { type: integer, description: Cost of runs queued in the last seven days. }
        success_rate:
          type: [number, "null"]
          description: completed / ended over the agent's whole history; null until a run ends.
    AgentListResponse:
      type: object
      required: [agents]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        role: { type: string }
        color: { type: string, description: "#rrggbb; defaults from a palette when omitted." }
        model: { type: string, description: Defaults to claude-sonnet-5. }
        effort: { type: string, description: Defaults to medium. }
        autonomy: { $ref: "#/components/schemas/AgentAutonomy" }
        directive: { type: string, description: The version-1 directive body (may be empty). }
    UpdateAgentRequest:
      type: object
      description: Absent fields are unchanged. `daily_cap_cents` null clears the cap.
      properties:
        name: { type: string }
        role: { type: string }
        color: { type: string }
        model: { type: string }
        effort: { type: string }
        autonomy: { $ref: "#/components/schemas/AgentAutonomy" }
        permissions: { $ref: "#/components/schemas/AgentPermissions" }
        git_author_name: { type: string }
        git_author_email: { type: string }
        enabled: { type: boolean }
        concurrency_cap: { type: integer }
        daily_cap_cents: { type: [integer, "null"] }
        max_wall_clock_seconds: { type: integer }
        max_steps: { type: integer }
    StarterRosterResult:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items: { type: string }
          description: The agent names created; existing names are skipped.
    Directive:
      type: object
      required: [id, agent_id, version, body, token_estimate, author_id, note, created_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        version: { type: integer }
        body: { type: string }
        token_estimate:
          type: integer
          description: The documented heuristic — body characters / 4.
        author_id: { type: [string, "null"] }
        note: { type: string }
        created_at: { type: string }
    DirectiveListResponse:
      type: object
      required: [directives]
      properties:
        directives: { type: array, items: { $ref: "#/components/schemas/Directive" } }
    SaveDirectiveRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        note: { type: string }
    SaveDirectiveResponse:
      allOf:
        - $ref: "#/components/schemas/Directive"
        - type: object
          required: [created]
          properties:
            created:
              type: boolean
              description: True when a new version was appended; false on the unchanged no-op.
    EstimateRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
    EstimateResponse:
      type: object
      required: [token_estimate]
      properties:
        token_estimate: { type: integer }
    AgentScope:
      type: string
      enum: [always, auto, paths, manual, never]
    TriggerCandidate:
      type: object
      description: A pre-filled suggested trigger. Created DISABLED — the toggles ship off (§6.3).
      required: [id, name, event, activity_types, description, workflows, checked, already_created]
      properties:
        id: { type: string }
        name: { type: string }
        event: { type: string }
        activity_types: { type: array, items: { type: string } }
        description: { type: string }
        workflows: { type: array, items: { type: string } }
        checked: { type: boolean }
        already_created: { type: boolean }
    AgentCandidate:
      type: object
      required: [name, role, model, directive, checked, already_created]
      properties:
        name: { type: string }
        role: { type: string }
        model: { type: string }
        directive: { type: string }
        checked: { type: boolean }
        already_created: { type: boolean }
    OverviewCandidate:
      type: object
      required: [draft, checked, already_set]
      properties:
        draft: { type: string }
        checked: { type: boolean }
        already_set: { type: boolean }
    BootstrapPreview:
      type: object
      required: [issues, docs, triggers, agents, overview]
      properties:
        issues: { type: array, items: { $ref: "#/components/schemas/IssueCandidate" } }
        docs: { type: array, items: { $ref: "#/components/schemas/DocCandidate" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/TriggerCandidate" } }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentCandidate" } }
        overview: { $ref: "#/components/schemas/OverviewCandidate" }
    DocChoice:
      type: object
      required: [path, scope]
      properties:
        path: { type: string }
        scope: { $ref: "#/components/schemas/AgentScope" }
        paths: { type: array, items: { type: string } }
    BootstrapApplyRequest:
      type: object
      description: Exactly the checked subset. Absent sections create nothing.
      properties:
        issues: { type: array, items: { type: integer } }
        docs: { type: array, items: { $ref: "#/components/schemas/DocChoice" } }
        triggers:
          type: array
          items: { type: string }
          description: Candidate IDs from the preview.
        agents:
          type: array
          items: { type: string }
          description: Candidate names from the preview.
        overview: { type: [string, "null"] }
    BootstrapApplyResult:
      type: object
      required:
        [tickets_created, issues_skipped, pages_created, docs_skipped, triggers_created,
         agents_created, overview_set]
      properties:
        tickets_created: { type: array, items: { type: string } }
        issues_skipped: { type: array, items: { type: integer } }
        pages_created: { type: array, items: { type: string } }
        docs_skipped: { type: array, items: { type: string } }
        triggers_created: { type: array, items: { type: string } }
        agents_created: { type: array, items: { type: string } }
        overview_set: { type: boolean }
    ColumnCategory:
      type: string
      description: >
        The stable key automation reads (brief D2 / plan rule 3). Code branches on this, never
        on a column's user-facing name.
      enum: [backlog, ready, running, review, done, canceled]
    Column:
      type: object
      required:
        [id, project_id, name, category, position, wip_limit, auto_start_delegate,
         ticket_count, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string, description: A display string; renaming changes nothing functional. }
        category: { $ref: "#/components/schemas/ColumnCategory" }
        position:
          type: integer
          description: Gap-spaced board ordering; treat as opaque and sort by it.
        wip_limit: { type: [integer, "null"], description: Null means no limit. }
        auto_start_delegate:
          type: boolean
          description: >
            Tickets moved into this column automatically start their delegate agent — agent
            runs cost money, so the UI requires an explicit confirm to enable it.
        ticket_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ColumnListResponse:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
    CreateColumnRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { $ref: "#/components/schemas/ColumnCategory" }
    UpdateColumnRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. `wip_limit` accepts an explicit null to
        clear the limit. `after_id` reorders: null moves the column to the front, a column id
        places it immediately after that column.
      properties:
        name: { type: string }
        category: { $ref: "#/components/schemas/ColumnCategory" }
        wip_limit: { type: [integer, "null"] }
        auto_start_delegate: { type: boolean }
        after_id: { type: [string, "null"] }
    WorkspaceSettings:
      type: object
      required:
        [default_branch, default_branch_template, default_network_policy,
         default_daily_budget_cents, default_context_threshold_tokens,
         default_verification_days, max_concurrent_containers, poll_interval_seconds,
         updated_at]
      properties:
        default_branch: { type: string }
        default_branch_template: { type: string }
        default_network_policy: { type: string, enum: [none, allowlist, open] }
        default_daily_budget_cents: { type: integer }
        default_context_threshold_tokens: { type: integer }
        default_verification_days: { type: integer }
        max_concurrent_containers: { type: integer }
        poll_interval_seconds: { type: integer }
        updated_at: { type: string, format: date-time }
    UpdateWorkspaceSettingsRequest:
      type: object
      description: Every field optional; absent = unchanged.
      properties:
        default_branch: { type: string }
        default_branch_template: { type: string }
        default_network_policy: { type: string, enum: [none, allowlist, open] }
        default_daily_budget_cents: { type: integer }
        default_context_threshold_tokens: { type: integer }
        default_verification_days: { type: integer }
        max_concurrent_containers: { type: integer }
        poll_interval_seconds: { type: integer }
    Secret:
      type: object
      description: >
        A secret's metadata (D-16). Deliberately value-free: there is no field for the stored
        value anywhere in this API, and no route that returns one. The UI renders
        "set · <relative updated_at>".
      required: [id, scope, project_id, name, created_at, updated_at]
      properties:
        id: { type: string }
        scope: { type: string, enum: [workspace, project] }
        project_id:
          type: [string, "null"]
          description: Null for workspace-scope secrets.
        name:
          type: string
          description: Env-var shaped — this is the variable name inside a run container (S19).
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the value was last set — the "set · 4 days ago" date.
    SecretListResponse:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    SetSecretRequest:
      type: object
      description: Create the named secret, or replace the existing one's value.
      required: [name, value]
      properties:
        name:
          type: string
          description: "A–Z, 0–9 and _, not starting with a digit; at most 128 characters."
        value:
          type: string
          description: Write-only; at most 64 KiB. Never returned by any route.
    RenameSecretRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    CredentialSourceStatus:
      type: object
      description: One credential source's health. Value-free by construction (D-16).
      required: [configured, healthy, message]
      properties:
        configured: { type: boolean }
        healthy: { type: boolean }
        message:
          type: string
          description: The source's health error, rendered verbatim in settings; empty when healthy.
    CredentialsStatus:
      type: object
      description: The workspace credentials screen's data (D-5).
      required: [oauth_token, env, import]
      properties:
        oauth_token: { $ref: "#/components/schemas/CredentialSourceStatus" }
        env: { $ref: "#/components/schemas/CredentialSourceStatus" }
        import:
          type: object
          required: [available, path]
          properties:
            available:
              type: boolean
              description: True only when the server runs on Linux (macOS uses the Keychain).
            path: { type: string }
    SetOAuthTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The `claude setup-token` output. Write-only; never returned by any route.
    TicketPriority:
      type: string
      enum: [none, low, medium, high, urgent]
    TicketOrigin:
      type: string
      enum: [human, agent, trigger, import]
    Ticket:
      type: object
      description: >
        `category` is the ticket's status, derived from its column's category — never stored,
        never a column name (plan rule 3). `assignee_id` is the accountable human and
        `delegate_agent_id` the working agent — separate axes, not alternatives (D1).
      required:
        [id, project_id, seq, key, title, description, column_id, category, position,
         priority, assignee_id, delegate_agent_id, parent_id, pr_number, pr_state, branch,
         origin, created_by_user_id, created_by_agent_id, label_ids, criteria_total,
         criteria_checked, archived_at, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        seq: { type: integer }
        key: { type: string, description: "'PAY-14' — allocated atomically at creation." }
        title: { type: string }
        description: { type: string }
        column_id: { type: string }
        category: { $ref: "#/components/schemas/ColumnCategory" }
        position:
          type: number
          description: Fractional board ordering; treat as opaque and sort by it.
        priority: { $ref: "#/components/schemas/TicketPriority" }
        assignee_id: { type: [string, "null"] }
        delegate_agent_id: { type: [string, "null"] }
        parent_id: { type: [string, "null"] }
        pr_number: { type: [integer, "null"] }
        pr_state: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        origin: { $ref: "#/components/schemas/TicketOrigin" }
        created_by_user_id: { type: [string, "null"] }
        created_by_agent_id: { type: [string, "null"] }
        label_ids:
          type: array
          items: { type: string }
        criteria_total:
          type: integer
          description: >
            Acceptance-criteria progress (S11): total checklist items. The board card renders
            "▸ 3/5 acceptance criteria" from these two counts — only when criteria_total > 0.
        criteria_checked: { type: integer }
        archived_at: { type: [string, "null"], description: Set = archived (D-15 soft delete). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TriageState:
      type: string
      enum: [pending, accepted, duplicate, declined, snoozed]
    TriageItem:
      type: object
      description: >
        One triage row (data model §4): the gate between automated ticket creation and the
        board. `provenance` is the verbatim human sentence the queue renders — "Created by
        trigger `CI failed → file a ticket` from run #482". `snooze_until` null while state
        is `snoozed` means "until new activity".
      required: [id, ticket_id, provenance, source_trigger_id, source_run_id, state,
                 duplicate_of, reason, snooze_until, resolved_by, resolved_at, created_at,
                 ticket]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        provenance: { type: string }
        source_trigger_id: { type: [string, "null"] }
        source_run_id: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/TriageState" }
        duplicate_of: { type: [string, "null"] }
        reason: { type: string }
        snooze_until: { type: [string, "null"], format: date-time }
        resolved_by: { type: [string, "null"] }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        ticket: { $ref: "#/components/schemas/Ticket" }
    TriageListResponse:
      type: object
      required: [items, pending_count, snoozed_count]
      properties:
        items:
          type: array
          description: Unresolved items — pending first, then snoozed, each oldest first.
          items: { $ref: "#/components/schemas/TriageItem" }
        pending_count:
          type: integer
          description: The tab badge — actionable (pending) items only, never snoozed.
        snoozed_count: { type: integer }
    TriageDuplicateRequest:
      type: object
      required: [of_ticket_id]
      properties:
        of_ticket_id:
          type: string
          description: The surviving ticket this one duplicates.
    TriageDeclineRequest:
      type: object
      properties:
        reason: { type: string }
    TriageSnoozeRequest:
      type: object
      properties:
        until:
          type: [string, "null"]
          format: date-time
          description: RFC3339 wake time; null or absent = until new activity.
    TicketListResponse:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [criteria, labels, children]
          properties:
            criteria:
              type: array
              items: { $ref: "#/components/schemas/Criterion" }
            labels:
              type: array
              items: { $ref: "#/components/schemas/Label" }
            children:
              type: array
              items: { $ref: "#/components/schemas/Ticket" }
    CreateTicketRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        column_id:
          type: string
          description: Omit to land in the first backlog-category column.
        assignee_id: { type: string }
        delegate_agent_id: { type: string }
        parent_id: { type: string }
    UpdateTicketRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. The nullable fields accept an explicit
        null to clear (unassign, remove the delegate, detach from parent).
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        assignee_id: { type: [string, "null"] }
        delegate_agent_id: { type: [string, "null"] }
        parent_id: { type: [string, "null"] }
    MoveTicketRequest:
      type: object
      required: [column_id]
      properties:
        column_id: { type: string }
        position:
          type: number
          description: An explicit fractional position, when the client computed it.
        after_ticket_id:
          type: [string, "null"]
          description: >
            Server-side placement: null = top of the column, a ticket id = right after it,
            absent = end of the column.
    SubticketsRequest:
      type: object
      description: One sub-ticket per title. `texts` is accepted as an alias for `titles`.
      properties:
        titles:
          type: array
          items: { type: string }
        texts:
          type: array
          items: { type: string }
    Criterion:
      type: object
      description: >
        One ordered acceptance-criteria checklist item. A human check stamps
        checked_by_user_id; an agent check (S22+) stamps checked_by_run_id.
      required:
        [id, ticket_id, position, text, checked, checked_by_run_id, checked_by_user_id,
         note, updated_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        position: { type: integer }
        text: { type: string }
        checked: { type: boolean }
        checked_by_run_id: { type: [string, "null"] }
        checked_by_user_id: { type: [string, "null"] }
        note: { type: string }
        updated_at: { type: string, format: date-time }
    CreateCriterionRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
    UpdateCriterionRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. `after_id` reorders — null = top, a
        criterion id = right after it.
      properties:
        text: { type: string }
        note: { type: string }
        checked: { type: boolean }
        after_id: { type: [string, "null"] }
    Label:
      type: object
      required: [id, project_id, name, color]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        color: { type: string, description: "#rrggbb" }
    LabelListResponse:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
    UpdateLabelRequest:
      type: object
      description: Every field optional; absent = unchanged.
      properties:
        name: { type: string }
        color: { type: string }
    TicketStreamEntry:
      type: object
      description: >
        One moment in a ticket's single chronological history (data model §4.1). `payload`
        carries an `event` verb ("created", "moved", "assigned", "label_added",
        "criterion_checked", …) plus event-specific details.
      required: [id, ticket_id, kind, actor_kind, actor_id, body, payload, run_id,
                 edited_at, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        kind:
          type: string
          enum: [comment, status_change, field_change, run, pr_event, trigger_fired, proposal]
        actor_kind:
          type: string
          enum: [human, agent, trigger, system]
        actor_id: { type: [string, "null"] }
        body: { type: string, description: Markdown, for comments (S12). }
        payload: {}
        run_id: { type: [string, "null"] }
        edited_at: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    TicketStreamResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TicketStreamEntry" }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: >
            Markdown. `@` mentions are the explicit token form the Editor writes —
            `@[label](user|agent|wiki|ticket:id)`; bare `@name` text is not a mention.
    CommentRunRequest:
      type: object
      description: >
        The honest outcome of one agent mention: the run request went through the scheduler
        seam. Until the S22 scheduler lands, `staged` is always false and `note` says so.
      required: [agent_id, agent_name, staged, note]
      properties:
        agent_id: { type: string }
        agent_name: { type: string }
        run_id: { type: string, description: "The created run's id, when one was staged." }
        staged: { type: boolean }
        note: { type: string }
    CommentResponse:
      type: object
      required: [entry, run_requests]
      properties:
        entry: { $ref: "#/components/schemas/TicketStreamEntry" }
        run_requests:
          type: array
          items: { $ref: "#/components/schemas/CommentRunRequest" }
    Member:
      type: object
      description: One row of the member directory — public display identity only.
      required: [id, display_name, avatar_color]
      properties:
        id: { type: string }
        display_name: { type: string }
        avatar_color: { type: string, description: "#rrggbb" }
    MemberListResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    RunState:
      type: string
      description: runs.state — only the kernel scheduler writes it (D-14).
      enum:
        - queued
        - provisioning
        - running
        - needs_input
        - awaiting_approval
        - completed
        - failed
        - timed_out
        - canceled
        - loop_stopped
    Run:
      type: object
      description: >
        One agent session. Autonomy, directive_version_id, model, effort and the prompt are
        snapshots taken at enqueue; hold_reason says in words why a queued run is queued.
      required:
        [id, seq, project_id, agent_id, ticket_id, trigger_id, state, state_reason,
         hold_reason, autonomy, directive_version_id, model, effort, branch, subject_key,
         current_step, cost_cents, tokens_in, tokens_out, tokens_cache_read,
         tokens_cache_write, step_count, error_message, takeover_note, queued_at,
         started_at, ended_at, acknowledged_at]
      properties:
        id: { type: string }
        seq: { type: integer, description: 'Per-project; renders as "run #482".' }
        project_id: { type: string }
        agent_id: { type: string }
        ticket_id: { type: [string, "null"] }
        trigger_id: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/RunState" }
        state_reason: { type: string }
        hold_reason: { type: string }
        autonomy: { type: string }
        directive_version_id: { type: [string, "null"] }
        model: { type: string }
        effort: { type: string }
        branch: { type: [string, "null"] }
        subject_key: { type: string }
        current_step: { type: string }
        cost_cents: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        tokens_cache_read: { type: integer }
        tokens_cache_write: { type: integer }
        step_count: { type: integer }
        error_message: { type: string }
        takeover_note:
          type: string
          description: The note stored when a human took the run over (§10.7).
        queued_at: { type: string }
        started_at: { type: [string, "null"] }
        ended_at: { type: [string, "null"] }
        acknowledged_at:
          type: [string, "null"]
          description: When set, a terminal run is dismissed from the needs-you surfaces.
    RunOutput:
      type: object
      description: One artifact a run produced (a branch, a PR, preserved partial work, …).
      required: [id, kind, ref, url, summary, created_at]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [branch, pull_request, comment, review, wiki_proposal, ticket, partial_work]
        ref: { type: string }
        url: { type: string }
        summary: { type: string }
        created_at: { type: string }
    RunContextItem:
      type: object
      description: >
        One labelled piece of the context stack the run was given — exactly what the run
        detail's Context panel renders (architecture §11). `reason` is rendered verbatim.
      required: [provider, source_kind, source_ref, title, reason, tokens, position, injected]
      properties:
        provider: { type: string }
        source_kind: { type: string }
        source_ref: { type: string }
        title: { type: string }
        reason: { type: string }
        tokens: { type: integer }
        position: { type: integer }
        injected: { type: boolean }
    RunActivity:
      type: object
      description: One step of a run's transcript, keyed (run_id, seq).
      required:
        [seq, type, level, tool_name, group_key, title, payload, ok, attempt, duration_ms,
         queued_ms, model_ms, tool_ms, cost_cents, tokens_in, tokens_out, created_at]
      properties:
        seq: { type: integer }
        type:
          type: string
          enum: [thought, action, elicitation, response, error, system, provision]
        level: { type: integer, description: '0 summary · 1 normal · 2 verbose.' }
        tool_name: { type: string }
        group_key: { type: string }
        title: { type: string }
        payload: {}
        ok: { type: [boolean, "null"] }
        attempt: { type: integer }
        duration_ms: { type: [integer, "null"] }
        queued_ms:
          type: [integer, "null"]
          description: The queued / model / tool timing-gutter split (UI spec §5.7).
        model_ms: { type: [integer, "null"] }
        tool_ms: { type: [integer, "null"] }
        cost_cents: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        created_at: { type: string }
    RunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
    RunDetailResponse:
      type: object
      required: [run, outputs, context, messages, elicitations]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/RunOutput" }
        context:
          type: array
          items: { $ref: "#/components/schemas/RunContextItem" }
        messages:
          type: array
          description: The steering queue — queued chips flip to delivered (S24).
          items: { $ref: "#/components/schemas/RunMessage" }
        elicitations:
          type: array
          description: >
            The run's questions and approvals, correlated to timeline rows by
            activity_seq — what the S24 respond surfaces answer.
          items: { $ref: "#/components/schemas/Elicitation" }
    RunActivitiesResponse:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items: { $ref: "#/components/schemas/RunActivity" }
    RunChainResponse:
      type: object
      required: [chain]
      properties:
        chain:
          type: array
          items: { $ref: "#/components/schemas/RunChainEntry" }
    RunChainEntry:
      type: object
      description: >
        One causal-chain node: `type` says which of the two bodies is set. Entries
        alternate event → run along each causality edge.
      required: [type]
      properties:
        type: { type: string, enum: [event, run] }
        event: { $ref: "#/components/schemas/RunChainEvent" }
        run: { $ref: "#/components/schemas/RunChainRun" }
    RunChainEvent:
      type: object
      required: [id, kind, activity_type, actor_kind, actor_login, subject, occurred_at]
      properties:
        id: { type: string }
        kind: { type: string }
        activity_type: { type: string }
        actor_kind: { type: string }
        actor_login: { type: string, nullable: true }
        subject:
          type: string
          description: The guard subject the event addresses ("pr:219" / "ticket:PAY-14" / "repo").
        occurred_at: { type: string }
    RunChainRun:
      type: object
      required: [id, seq, agent_id, agent_name, state, state_reason, depth, subject_key,
                 queued_at, ended_at, focus]
      properties:
        id: { type: string }
        seq: { type: integer }
        agent_id: { type: string }
        agent_name: { type: string }
        state: { $ref: "#/components/schemas/RunState" }
        state_reason: { type: string }
        depth: { type: integer }
        subject_key: { type: string }
        queued_at: { type: string }
        ended_at: { type: string, nullable: true }
        focus:
          type: boolean
          description: True on the run the chain was requested for.
    DelegateRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string }
        prompt:
          type: string
          description: Optional extra instruction; becomes the prompt's final Task section.
    DelegateResponse:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string }
    SteerRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
    RunMessage:
      type: object
      description: One queued steering message; delivered_at is stamped on handoff.
      required: [id, run_id, body, state, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        body: { type: string }
        state: { type: string, enum: [queued, delivered, dropped] }
        created_at: { type: string }
        delivered_at: { type: [string, "null"] }
    StopRunRequest:
      type: object
      properties:
        reason: { type: string }
    StopRunResponse:
      type: object
      required: [run]
      properties:
        run: { $ref: "#/components/schemas/Run" }
    TakeoverRequest:
      type: object
      properties:
        note:
          type: string
          description: >
            "Tell the agent what you changed before resuming" — stored on the run and
            injected into the prompt of the next run on the same ticket (§10.7).
    TakeoverResponse:
      type: object
      required: [run, checkout]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        checkout:
          type: string
          description: >
            The copy-paste block, e.g. `git fetch origin && git checkout dev/PAY-14`.
            Empty when the run never got a branch.
    NeedsYouRun:
      type: object
      description: >
        One row of the needs-you surfaces (architecture §12). `flavor` is the §4.3
        vocabulary and every renderer prints it in words (interaction rule 1).
      required:
        [id, project_key, ticket_id, ticket_key, ticket_title, agent, flavor, status,
         started_at]
      properties:
        id: { type: string }
        project_key: { type: string }
        ticket_id: { type: [string, "null"] }
        ticket_key: { type: [string, "null"] }
        ticket_title: { type: [string, "null"] }
        agent: { type: string, description: The agent's display name. }
        flavor: { type: string, enum: [question, approval, review, failure] }
        status: { type: string, description: The underlying run state. }
        started_at: { type: string }
    NeedsYouListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/NeedsYouRun" }
    Notification:
      type: object
      description: >
        One attention row — one per (user, run), updated in place, never stacked
        (interaction rule 3; architecture §12).
      required:
        [id, user_id, project_id, run_id, flavor, title, body, state, created_at,
         updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        project_id: { type: string }
        run_id: { type: [string, "null"] }
        flavor: { type: string, enum: [question, approval, review, failure] }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [unread, read, dismissed] }
        created_at: { type: string }
        updated_at: { type: string }
        project_key:
          type: string
          description: Present on list responses — what the dropdown links with.
    NotificationListResponse:
      type: object
      required: [notifications, unread]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread: { type: integer, description: The inbox badge count. }
    NotificationResponse:
      type: object
      required: [notification]
      properties:
        notification: { $ref: "#/components/schemas/Notification" }
    StreamEventType:
      type: string
      description: >
        The SSE `event:` names (contracts §5.1, plus the S10 ticket/label events and S12's
        ticket.commented).
      enum:
        - run.state
        - run.activity
        - run.step
        - run.usage
        - run.elicitation
        - run.message
        - ticket.created
        - ticket.updated
        - ticket.commented
        - ticket.moved
        - ticket.archived
        - ticket.unarchived
        - agent.created
        - agent.updated
        - agent.archived
        - label.created
        - label.updated
        - label.deleted
        - board.updated
        - triage.created
        - triage.accepted
        - triage.duplicate
        - triage.declined
        - triage.snoozed
        - triage.woken
        - trigger.fired
        - trigger.created
        - trigger.updated
        - trigger.deleted
        - notification.updated
        - wiki.proposed
        - provision.step
        - module.degraded
    StreamFrame:
      type: object
      description: The `data:` payload of every SSE frame.
      required: [topic, payload]
      properties:
        topic: { type: string }
        payload: {}
    Trigger:
      type: object
      description: >
        One trigger row. The JSON-valued columns pass through as stored: `conditions` is the
        `{all}|{any}|{field,op,value}` tree over contracts §4.1 operators, `actions` the
        ordered `[{action_id, params}]` list, `loop_config` the data-model §6.1 shape. `health`
        is present on reads that aggregate it (list/get).
      required:
        [id, project_id, name, enabled, source_id, event, activity_types, filters,
         conditions, actions, loop_config, cron, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        source_id: { type: string }
        event: { type: string }
        activity_types:
          type: array
          items: { type: string }
        filters: { $ref: "#/components/schemas/TriggerFilters" }
        conditions: {}
        actions:
          type: array
          items: { $ref: "#/components/schemas/TriggerActionRef" }
        loop_config: { $ref: "#/components/schemas/LoopConfig" }
        cron: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
        health: { $ref: "#/components/schemas/TriggerHealth" }
        action_summaries:
          type: array
          description: >
            One Describe() sentence per action, in action order — the THEN line of the
            prose card ("run agent Reviewer"). Present on the health-carrying reads
            (list/get); an unregistered action degrades to naming its id.
          items: { type: string }
    TriggerFilters:
      type: object
      description: Stage-1 matcher filters; an absent or empty list is no constraint.
      properties:
        branches:
          type: array
          items: { type: string }
        paths:
          type: array
          items: { type: string }
        labels:
          type: array
          items: { type: string }
    TriggerActionRef:
      type: object
      description: One THEN step, executed in list order.
      required: [action_id]
      properties:
        action_id: { type: string }
        params: {}
    LoopConfig:
      type: object
      description: >
        Data model §6.1. `daily_budget_cents: null` inherits the project ceiling. Enforced by
        the S27 guard; stored and validated from S26.
      properties:
        actor_suppression: { type: boolean }
        debounce_seconds: { type: integer }
        cancel_in_progress: { type: boolean }
        depth_limit: { type: integer }
        daily_budget_cents: { type: [integer, "null"] }
    TriggerHealth:
      type: object
      description: >
        Per-outcome counts over the last 50 firings — the `14 ok · 3 no action · 1 loop`
        breakdown, never collapsed to success/failure — plus the recent outcome sequence
        the card sparkline renders.
      required: [counts, last_fired_at, recent]
      properties:
        counts:
          type: object
          additionalProperties: { type: integer }
        last_fired_at: { type: [string, "null"] }
        recent:
          type: array
          description: The last (up to) 20 firing outcome classes, oldest first.
          items: { $ref: "#/components/schemas/FiringOutcome" }
    TriggerInput:
      type: object
      description: >
        Create/patch body. Every field optional; absent = unchanged (create fills defaults and
        requires name and event). `cron: ""` clears the expression.
      properties:
        name: { type: string }
        enabled: { type: boolean }
        source_id: { type: string }
        event: { type: string }
        activity_types:
          type: array
          items: { type: string }
        filters: { $ref: "#/components/schemas/TriggerFilters" }
        conditions: {}
        actions:
          type: array
          items: { $ref: "#/components/schemas/TriggerActionRef" }
        loop_config: { $ref: "#/components/schemas/LoopConfig" }
        cron: { type: string }
    TriggerListResponse:
      type: object
      required: [triggers]
      properties:
        triggers:
          type: array
          items: { $ref: "#/components/schemas/Trigger" }
    TriggerFiring:
      type: object
      description: >
        One terminal pipeline outcome for one (trigger, event) pair — the eight outcome
        classes, each with its reason in words. `warnings` carries interpolation warnings
        ("unknown path {{x}} rendered as empty").
      required: [id, trigger_id, event_id, outcome, reason, run_id, absorbed_by_run_id,
                 warnings, created_at]
      properties:
        id: { type: string }
        trigger_id: { type: string }
        event_id: { type: string }
        outcome: { $ref: "#/components/schemas/FiringOutcome" }
        reason: { type: string }
        run_id: { type: [string, "null"] }
        absorbed_by_run_id: { type: [string, "null"] }
        warnings:
          type: array
          items: { type: string }
        created_at: { type: string }
        event: { $ref: "#/components/schemas/TriggerFiringEvent" }
    FiringOutcome:
      type: string
      description: The eight §4.2 trigger outcome classes.
      enum: [succeeded, no_action, awaiting_approval, errored,
             debounced, superseded, loop_stopped, budget_exceeded]
    TriggerFiringEvent:
      type: object
      description: >
        A summary of the event that caused the firing, so the history list can say what
        happened without a per-row fetch.
      required: [kind, activity_type, actor_kind, actor_login, subject, occurred_at]
      properties:
        kind: { type: string }
        activity_type: { type: string }
        actor_kind: { type: string }
        actor_login: { type: [string, "null"] }
        subject:
          type: string
          description: The guard-style subject ("pr:219" / "ticket:PAY-14" / "repo").
        occurred_at: { type: string }
    TriggerFiringListResponse:
      type: object
      required: [firings]
      properties:
        firings:
          type: array
          items: { $ref: "#/components/schemas/TriggerFiring" }
    BacktestResult:
      type: object
      description: >
        One stages-1–2 replay (S30). `matched` counts every matching event; `events` holds the
        newest 100 of them (`truncated` says when they differ). `no_history` distinguishes "the
        project has no external event history at all" (nothing matched and no stored events
        beyond internal bookkeeping — history builds up from repo connection) from "history
        exists but nothing matched" — the editor's distinct empty state. The guard and actions
        are not simulated.
      required: [days, scanned, matched, truncated, events, would_do, no_history]
      properties:
        days:
          type: integer
          description: The window actually used, after clamping to 1..30.
        scanned:
          type: integer
          description: How many stored events the window held, matching or not.
        matched:
          type: integer
          description: How many passed stages 1–2 (match + conditions).
        truncated:
          type: boolean
          description: True when `events` holds fewer than `matched` rows.
        events:
          type: array
          description: The matching events, newest first, capped at 100.
          items: { $ref: "#/components/schemas/BacktestEvent" }
        would_do:
          type: array
          description: >
            One Describe() sentence per configured action, in action order — what each
            matching event would have caused ("run agent Reviewer").
          items: { type: string }
        no_history:
          type: boolean
          description: >
            True when nothing matched and the project has no stored events from an external
            source.
    BacktestEvent:
      allOf:
        - $ref: "#/components/schemas/TriggerFiringEvent"
        - type: object
          description: One matching historical event.
          required: [event_id]
          properties:
            event_id: { type: string }
    TriggerCatalog:
      type: object
      description: >
        The whole trigger-editor payload (S29): sources → WHEN, actions → THEN,
        operators → IF. Interpolation ({{...}}) offers each event descriptor's `fields`.
      required: [sources, actions, operators]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/CatalogSource" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/CatalogAction" }
        operators:
          type: array
          items: { $ref: "#/components/schemas/CatalogOperator" }
    CatalogSource:
      type: object
      description: One registered EventSource's Catalog(), keyed by its port ID.
      required: [id, events]
      properties:
        id: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CatalogEvent" }
    CatalogEvent:
      type: object
      description: One event kind (contracts §2.1 EventDescriptor), rendered as stored.
      required: [kind, label, activity_types, filters, fields, subject_key]
      properties:
        kind: { type: string }
        label: { type: string }
        activity_types:
          type: array
          items: { $ref: "#/components/schemas/CatalogActivityType" }
        filters:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/CatalogFilter" }
        fields:
          type: [array, "null"]
          description: >
            The payload paths conditions and {{...}} interpolation may address for this
            event kind — the IF field dropdown and the interpolation picker share it.
          items: { $ref: "#/components/schemas/CatalogField" }
        subject_key: { type: string }
    CatalogActivityType:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        help:
          type: string
          description: Why this activity type is different — "opened vs synchronize".
    CatalogFilter:
      type: object
      required: [key, kind, label]
      properties:
        key: { type: string }
        kind: { type: string, enum: [glob-list, label-list] }
        label: { type: string }
    CatalogField:
      type: object
      required: [path, type]
      properties:
        path: { type: string }
        type: { type: string, enum: [text, number, bool, enum, set] }
        enum:
          type: array
          description: An enum field's known values; absent means free text.
          items: { type: string }
    CatalogAction:
      type: object
      description: One registered TriggerAction — its Schema() drives the THEN form.
      required: [id, label, schema]
      properties:
        id: { type: string }
        label: { type: string }
        schema: { $ref: "#/components/schemas/ActionParamSchema" }
    ActionParamSchema:
      type: object
      required: [fields]
      properties:
        fields:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ActionParamField" }
    ActionParamField:
      type: object
      description: >
        One typed action parameter (contracts §2.5). The type vocabulary drives the THEN
        widgets: "agent" renders the project's agent picker, "template" a text input with
        the {{...}} interpolation field picker, "category" the fixed column-category
        select (D2 — never column names), "list" a list of strings.
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [text, number, bool, enum, agent, template, category, list]
        required: { type: boolean }
        enum:
          type: array
          items: { type: string }
        help: { type: string }
    CatalogOperator:
      type: object
      description: >
        One contracts §4.1 condition operator. `family` is the visible type prefix
        ("(text) contains"); `value` says what right-hand input the operator takes;
        `field` is false for actor.* operators, whose field is implied.
      required: [op, family, label, value, field]
      properties:
        op: { type: string }
        family: { type: string, enum: [text, number, enum, bool, set, actor] }
        label: { type: string }
        value: { type: string, enum: [text, number, bool, enum, enum_list, none] }
        field: { type: boolean }
