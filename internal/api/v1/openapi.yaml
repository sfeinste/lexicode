# Lexicode HTTP API v1 — the endpoints that exist TODAY (through story S12).
#
# This file is the source of truth for request/response shapes (contracts §5). The frontend's
# TypeScript types are generated from it: `make api-types` regenerates
# web/src/lib/api/types.gen.ts, and `make check` fails if the committed file is stale.
#
# Grow this file in the story that adds the route — never ahead of it.
openapi: 3.1.0
info:
  title: Lexicode API
  version: "1"
  description: >
    JSON over cookie-session auth. Every error is application/problem+json with a stable
    `type` slug the frontend switches on (architecture §14). While the database has zero
    users, every call except POST /auth/setup answers 401 `setup_required`.
servers:
  - url: /api/v1
paths:
  /auth/setup:
    post:
      operationId: authSetup
      summary: First-run owner creation. 409 `already_setup` once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Owner created and signed in (session cookie set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      operationId: authLogin
      summary: Sign in with email and password. 401 `invalid_credentials` on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in (session cookie set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session. Idempotent.
      responses:
        "204":
          description: Session revoked and cookie cleared.
  /auth/me:
    get:
      operationId: authMe
      summary: The signed-in user. 401 `unauthenticated` or `session_expired` otherwise.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
  /invites:
    post:
      operationId: createInvite
      summary: Mint a one-time invite link (owner only). The raw token appears here once.
      responses:
        "201":
          description: The copyable invite path and its expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /invites/{token}/redeem:
    post:
      operationId: redeemInvite
      summary: >
        Join via an invite link. 404 `invite_invalid` for an unknown or used token,
        410 `invite_expired` past expiry, 409 `email_taken`.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "201":
          description: Member created and signed in (session cookie set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /users:
    get:
      operationId: listUsers
      summary: >
        The member directory (S12): every non-archived user's public display identity —
        the assignee picker and `@` mention autocomplete read this. Any signed-in user;
        no email, role or credential material crosses the wire.
      responses:
        "200":
          description: Every non-archived user, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /system/modules:
    get:
      operationId: systemModules
      summary: Registered modules and their post-boot state.
      responses:
        "200":
          description: The module list. Empty list, never null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModulesResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects:
    get:
      operationId: listProjects
      summary: >
        Projects with Home-table stats (UI spec §5.1), oldest first. Archived projects are
        excluded unless ?archived=1.
      parameters:
        - name: archived
          in: query
          schema: { type: string, enum: ["1", "true"] }
          description: Include archived projects.
      responses:
        "200":
          description: The project list. Empty list, never null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      summary: >
        Create a project; the caller becomes owner and first member. A duplicate or malformed
        key is a 400 `validation_failed` problem naming the `key` field. Settings columns start
        null (inherit from workspace); board columns arrive with S09.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects/{key}:
    get:
      operationId: getProject
      summary: One project, with its settings resolved against the workspace defaults.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      summary: >
        Patch a project. Absent fields are unchanged. The inheritable settings
        (daily_budget_cents, context_threshold_tokens, verification_days) are tri-state:
        a number overrides the workspace default, an explicit null reverts to inherit.
        `archived` true/false archives and unarchives.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/overview:
    get:
      operationId: projectOverview
      summary: >
        The Overview About card (UI spec §5.2) — the fields that exist through S08. `repo` is
        null until a repository is connected (S14); recent runs, pinned pages and the activity
        feed arrive with their stories.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The About card data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectOverview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/secrets:
    get:
      operationId: listProjectSecrets
      summary: >
        A project's secrets — names and dates only. Secret values are write-only through the
        API (D-16): no route ever returns one.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The secret list, name order. Metadata only, never values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setProjectSecret
      summary: >
        Set a secret: create it, or replace the value of the existing secret with this name.
        The one shape a value ever crosses the API in — requests only, never responses.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSecretRequest" }
      responses:
        "200":
          description: The value of the existing secret with this name was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: A new secret was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/secrets/{id}:
    patch:
      operationId: renameProjectSecret
      summary: Rename a secret. The stored value is untouched.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameSecretRequest" }
      responses:
        "200":
          description: The renamed secret's metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProjectSecret
      summary: >
        Delete a secret. A secret something still references (a connected repo's token)
        answers 409 secret_in_use rather than orphaning the reference.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/repo:
    post:
      operationId: connectRepo
      summary: >
        Connect a GitHub repository (S15): verify owner/name + PAT against the forge, store
        the token as the project's GITHUB_TOKEN secret (write-only, D-16) and persist the
        repos row with the default branch and head commit for the About card. Reconnecting
        replaces the token and refreshes the row.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepoRequest" }
      responses:
        "201":
          description: The connected repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      operationId: repoStatus
      summary: The project's repo connection. `connected:false` is a normal state, not a 404.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Whether a repository is connected, and which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: disconnectRepo
      summary: >
        Disconnect the repository and delete the stored token. Everything a bootstrap
        imported — tickets, wiki pages, triggers, agents — stays with the project.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/bootstrap/preview:
    post:
      operationId: bootstrapPreview
      summary: >
        The bootstrap checklist in one payload (brief §6.3): open issues checked by default,
        detected instruction docs with proposed agent_scope (D-11), detected CI as two
        pre-filled triggers whose toggles are OFF, suggested starter agents, and an Overview
        draft from the README. Writes nothing. Previously imported items (matched on issue
        number / doc path) come back unchecked and labeled.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The checklist payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapPreview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/bootstrap/apply:
    post:
      operationId: bootstrapApply
      summary: >
        Create exactly the checked subset: tickets from issues (origin `import`), live wiki
        pages from docs, the suggested triggers DISABLED, the starter agents, the project
        description. Already-imported items are skipped, never duplicated.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapApplyRequest" }
      responses:
        "200":
          description: What was created and what was skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{key}/columns:
    get:
      operationId: listColumns
      summary: >
        A project's board columns in board order, with ticket counts. Names are display
        strings; automation keys off `category` (plan rule 3), never the name.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The column list. Every project has at least backlog, running and done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColumnListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createColumn
      summary: >
        Add a column at the end of the board. Category is chosen at creation (and editable
        later) — it is what automation reads.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateColumnRequest" }
      responses:
        "201":
          description: The created column.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /columns/{id}:
    patch:
      operationId: updateColumn
      summary: >
        Patch a column: rename, category, WIP limit (null clears), auto_start_delegate,
        reorder via `after_id` (null = move to the front, a column id = place after it).
        Changing the category of the project's last backlog/running/done column is a 409
        `last_category_column` problem naming the category.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateColumnRequest" }
      responses:
        "200":
          description: The updated column.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteColumn
      summary: >
        Delete a column. If it holds tickets, `destination_column_id` names the column that
        receives them (same board, not the column itself) and the move happens in the delete's
        transaction; omitting it is a 400 `validation_failed` naming the field. Deleting the
        project's last backlog/running/done column is a 409 `last_category_column` problem
        naming the category.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: destination_column_id
          in: query
          schema: { type: string }
          description: Where the column's tickets go. Required when the column holds tickets.
      responses:
        "204": { description: Deleted (and tickets moved, when a destination was given). }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/tickets:
    get:
      operationId: listTickets
      summary: >
        A project's tickets in board order (column, then fractional position). Archived
        tickets are hidden unless `archived=1`. Each ticket's `category` is derived from its
        column — status is never stored and never a column name (plan rule 3).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - name: archived
          in: query
          schema: { type: string, enum: ["1"] }
          description: Include archived tickets.
      responses:
        "200":
          description: The ticket list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: >
        Create a ticket. The key (PAY-14) is allocated atomically from the project's sequence
        inside the insert transaction — two concurrent creates never collide. Omitting
        `column_id` lands the ticket in the first backlog-category column. Nesting under a
        ticket that is itself a sub-ticket is a 409 `subticket_depth` problem.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTicketRequest" }
      responses:
        "201":
          description: The created ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}:
    get:
      operationId: getTicket
      summary: One ticket with its acceptance criteria, labels and sub-tickets.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ticket detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTicket
      summary: >
        Patch a ticket. `assignee_id` (human, D1) and `delegate_agent_id` (agent, D1) accept
        an explicit null to clear; `parent_id` null detaches a sub-ticket. Mutating an
        archived ticket is a 409 `ticket_archived`; violating the one-level sub-ticket rule
        is a 409 `subticket_depth`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTicketRequest" }
      responses:
        "200":
          description: The updated ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: archiveTicket
      summary: >
        Archive (soft delete, D-15): archived_at is stamped, active runs are cancelled with
        reason "ticket archived", history is kept, unarchive restores. `confirm_active_runs`
        must equal the ticket's current active-run count (default 0); a mismatch is a 409
        `active_runs_confirmation` naming the real count.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: confirm_active_runs
          in: query
          schema: { type: integer, minimum: 0 }
          description: How many active runs the caller confirms will be cancelled.
      responses:
        "204": { description: Archived. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/unarchive:
    post:
      operationId: unarchiveTicket
      summary: Restore an archived ticket. 409 `ticket_not_archived` when it is not archived.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The restored ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/move:
    post:
      operationId: moveTicket
      summary: >
        Move a ticket to a column at a fractional position. Send either an explicit
        `position` (a client that computed the midpoint itself) or `after_ticket_id` (null =
        top of the column, a ticket id = right after it, absent = end) and the server
        computes the true float midpoint, renormalising the column when midpoints are
        exhausted. A move NEVER starts a run (brief D3): when the destination column has
        auto_start_delegate and the ticket has a delegate, the intent goes through the run
        scheduler — audited, and a no-op until S22.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveTicketRequest" }
      responses:
        "200":
          description: The moved ticket, with its server-assigned position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/subtickets:
    post:
      operationId: createSubtickets
      summary: >
        Create one sub-ticket per title, atomically, in the parent's column — the backing
        endpoint for selection→sub-tickets. One level only: calling this on a sub-ticket is
        a 409 `subticket_depth`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubticketsRequest" }
      responses:
        "201":
          description: The created sub-tickets, in input order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketListResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/stream:
    get:
      operationId: getTicketStream
      summary: >
        The unified ticket stream, oldest first — one chronological history, no
        Comments/Activity split (data model §4.1).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Every stream entry for the ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketStreamResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createComment
      summary: >
        Append a comment to the stream (S12): one kind='comment' row with the markdown body
        and actor attribution. `@[label](kind:id)` mention tokens in the body are parsed
        into the mentions table; each distinct mentioned agent stages a run request through
        the scheduler seam — `run_requests` reports the honest outcome per agent (staged is
        false with an explanatory note until the S22 scheduler exists). 409
        `ticket_archived` on an archived ticket.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: The created stream entry and any agent-mention run request outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/criteria:
    post:
      operationId: addCriterion
      summary: Append one acceptance criterion to the ticket's ordered checklist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCriterionRequest" }
      responses:
        "201":
          description: The created criterion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /criteria/{id}:
    patch:
      operationId: updateCriterion
      summary: >
        Patch a criterion: text, note, checked (a human check records the acting user;
        checked_by_run_id is written by agent runs from S22), and reorder via `after_id`
        (null = top, a criterion id = right after it).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCriterionRequest" }
      responses:
        "200":
          description: The updated criterion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCriterion
      summary: Remove a criterion from its ticket's checklist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{key}/labels:
    get:
      operationId: listLabels
      summary: A project's labels, sorted by name. Labels are project-scoped.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The label list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createLabel
      summary: >
        Create a label with a #rrggbb colour. A duplicate name within the project is a
        field-level 400.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabelRequest" }
      responses:
        "201":
          description: The created label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /labels/{id}:
    patch:
      operationId: updateLabel
      summary: Rename or recolour a label; every ticket wearing it follows.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLabelRequest" }
      responses:
        "200":
          description: The updated label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLabel
      summary: Delete a label, detaching it from every ticket in the same transaction.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted and detached everywhere. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tickets/{id}/labels/{label_id}:
    put:
      operationId: attachLabel
      summary: Put a label on a ticket. Idempotent — attaching twice is a no-op.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: label_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Attached (or already attached). }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: detachLabel
      summary: Take a label off a ticket. Idempotent — detaching twice is a no-op.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: label_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Detached (or was not attached). }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workspace/settings:
    get:
      operationId: getWorkspaceSettings
      summary: The single workspace_settings row (owner only).
      responses:
        "200":
          description: The workspace settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateWorkspaceSettings
      summary: >
        Update the workspace settings (owner only). Absent fields are unchanged, so the
        settings screen can autosave one control at a time. Projects whose settings columns
        are null follow the new values immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceSettingsRequest" }
      responses:
        "200":
          description: The updated workspace settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /workspace/secrets:
    get:
      operationId: listWorkspaceSecrets
      summary: >
        Workspace-scope secrets (owner only) — names and dates only, like the project list.
        Values are write-only through the API (D-16).
      responses:
        "200":
          description: The secret list, name order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setWorkspaceSecret
      summary: Set a workspace-scope secret — create, or replace the existing name's value (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSecretRequest" }
      responses:
        "200":
          description: The value of the existing secret with this name was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: A new secret was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /workspace/secrets/{id}:
    patch:
      operationId: renameWorkspaceSecret
      summary: Rename a workspace-scope secret (owner only). The stored value is untouched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameSecretRequest" }
      responses:
        "200":
          description: The renamed secret's metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorkspaceSecret
      summary: Delete a workspace-scope secret (owner only).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /audit:
    get:
      operationId: auditList
      summary: Query the audit log (owner only). Keyset-paginated.
      parameters:
        - { name: project, in: query, schema: { type: string }, description: Project key or id. }
        - { name: actor, in: query, schema: { type: string }, description: "`human` or `human:<id>` (later: agent, trigger, system)." }
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string }, description: Target kind. }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of audit entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /stream:
    get:
      operationId: stream
      summary: >
        The SSE stream (contracts §5.1). One connection per tab;
        `?topics=project:PAY,run:01H…,inbox` selects topics. Frames carry `id:` (ULID),
        `event:` (StreamEventType) and `data:` (StreamFrame). `Last-Event-ID` on reconnect
        replays missed frames. Not consumable through fetch — the SPA uses EventSource.
      parameters:
        - name: topics
          in: query
          schema: { type: string }
          description: Comma-separated topic list.
      responses:
        "200":
          description: An event stream; stays open until the client goes away.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: application/problem+json with a stable `type` slug.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 problem details. `type` is a slug, not a URL. Slugs in use today:
        setup_required, already_setup, invalid_credentials, session_expired, unauthenticated,
        forbidden, invite_invalid, invite_expired, email_taken, not_found, invalid_request,
        validation_failed, last_category_column, internal.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    User:
      type: object
      required: [id, email, display_name, role, avatar_color, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [owner, member] }
        avatar_color: { type: string }
        created_at: { type: string, format: date-time }
    SetupRequest:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string }
        display_name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RedeemRequest:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string }
        display_name: { type: string }
        password: { type: string }
    Invite:
      type: object
      required: [path, expires_at]
      properties:
        path:
          type: string
          description: The one-time path (`/invite/<token>`) the owner copies into a message.
        expires_at: { type: string, format: date-time }
    ModulesResponse:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleStatus" }
    ModuleStatus:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string, enum: [ready, degraded] }
        reason: { type: string }
    AuditListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor:
          type: string
          description: Present exactly when the page was full; pass back as ?cursor=.
    AuditEntry:
      type: object
      required: [id, project_id, actor_kind, actor_id, action, target_kind, target_id, before, after, created_at]
      properties:
        id: { type: string }
        project_id: { type: [string, "null"] }
        actor_kind: { type: string }
        actor_id: { type: [string, "null"] }
        action: { type: string }
        target_kind: { type: string }
        target_id: { type: string }
        before: {}
        after: {}
        note: { type: string }
        created_at: { type: string, format: date-time }
    InheritedInt:
      type: object
      description: >
        One inheritable project setting resolved against the workspace default (data model §1):
        `value` is the effective value, `inherited` is whether the project column is null, and
        `workspace_value` is the live workspace default — everything the InheritedField control
        needs without recomputing.
      required: [value, inherited, workspace_value]
      properties:
        value: { type: integer }
        inherited: { type: boolean }
        workspace_value: { type: integer }
    ProjectSettings:
      type: object
      required: [daily_budget_cents, context_threshold_tokens, verification_days]
      properties:
        daily_budget_cents: { $ref: "#/components/schemas/InheritedInt" }
        context_threshold_tokens: { $ref: "#/components/schemas/InheritedInt" }
        verification_days: { $ref: "#/components/schemas/InheritedInt" }
    Project:
      type: object
      required:
        [id, key, name, description, color, owner_id, agent_guidance, archived_at,
         created_at, updated_at, settings]
      properties:
        id: { type: string }
        key: { type: string, description: "Uppercase, 2–10 chars: [A-Z][A-Z0-9]{1,9}." }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        owner_id: { type: string }
        agent_guidance: { type: string }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
    ProjectStats:
      type: object
      description: The Home-table counters (UI spec §5.1).
      required: [open_tickets, running_agents, needs_you, spend_today_cents, last_activity]
      properties:
        open_tickets: { type: integer }
        running_agents: { type: integer }
        needs_you: { type: integer }
        spend_today_cents: { type: integer }
        last_activity: { type: string, format: date-time }
    ProjectListItem:
      allOf:
        - { $ref: "#/components/schemas/Project" }
        - type: object
          required: [stats]
          properties:
            stats: { $ref: "#/components/schemas/ProjectStats" }
    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectListItem" }
    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        color: { type: string, description: "#rrggbb; defaults from a palette when omitted." }
    UpdateProjectRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. The three inheritable settings accept an
        explicit null to revert to inheriting the workspace default.
      properties:
        name: { type: string }
        description: { type: string }
        color: { type: string }
        owner_id: { type: string }
        agent_guidance: { type: string }
        archived: { type: boolean }
        daily_budget_cents: { type: [integer, "null"] }
        context_threshold_tokens: { type: [integer, "null"] }
        verification_days: { type: [integer, "null"] }
    ProjectOverview:
      type: object
      required:
        [project, owner, repo, agent_count, open_tickets, runs_today, spend_today_cents]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        owner: { $ref: "#/components/schemas/ProjectOwner" }
        repo:
          oneOf:
            - $ref: "#/components/schemas/OverviewRepo"
            - type: "null"
          description: Null until a repository is connected (S15).
        agent_count: { type: integer }
        open_tickets: { type: integer }
        runs_today: { type: integer }
        spend_today_cents: { type: integer }
    ProjectOwner:
      type: object
      required: [id, display_name, avatar_color]
      properties:
        id: { type: string }
        display_name: { type: string }
        avatar_color: { type: string }
    OverviewRepo:
      type: object
      description: The About card's repo facts (UI spec §5.2).
      required: [provider, owner, name, default_branch, head_sha, head_message]
      properties:
        provider: { type: string }
        owner: { type: string }
        name: { type: string }
        default_branch: { type: [string, "null"] }
        head_sha: { type: [string, "null"] }
        head_message: { type: [string, "null"] }
    ConnectRepoRequest:
      type: object
      required: [owner, name, token]
      properties:
        owner: { type: string }
        name: { type: string }
        token:
          type: string
          description: A GitHub PAT. Stored write-only as the project secret GITHUB_TOKEN (D-16).
    Repo:
      type: object
      description: A connected repository. The token never appears — only that one is stored.
      required:
        [provider, owner, name, default_branch, head_sha, head_message, connected_at,
         last_synced_at, has_token]
      properties:
        provider: { type: string }
        owner: { type: string }
        name: { type: string }
        default_branch: { type: [string, "null"] }
        head_sha: { type: [string, "null"] }
        head_message: { type: [string, "null"] }
        connected_at: { type: [string, "null"] }
        last_synced_at: { type: [string, "null"] }
        has_token: { type: boolean }
    RepoStatus:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        repo: { $ref: "#/components/schemas/Repo" }
    IssueCandidate:
      type: object
      required: [number, title, body, author_login, labels, url, checked, already_imported]
      properties:
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        author_login: { type: string }
        labels: { type: array, items: { type: string } }
        url: { type: string }
        checked: { type: boolean }
        already_imported: { type: boolean }
        ticket_key: { type: string, description: Set when already imported. }
    DocCandidate:
      type: object
      required: [path, title, proposed_scope, scope_paths, checked, already_imported]
      properties:
        path: { type: string }
        title: { type: string }
        proposed_scope: { $ref: "#/components/schemas/AgentScope" }
        scope_paths: { type: array, items: { type: string } }
        checked: { type: boolean }
        already_imported: { type: boolean }
        page_slug: { type: string, description: Set when already imported. }
    AgentScope:
      type: string
      enum: [always, auto, paths, manual, never]
    TriggerCandidate:
      type: object
      description: A pre-filled suggested trigger. Created DISABLED — the toggles ship off (§6.3).
      required: [id, name, event, activity_types, description, workflows, checked, already_created]
      properties:
        id: { type: string }
        name: { type: string }
        event: { type: string }
        activity_types: { type: array, items: { type: string } }
        description: { type: string }
        workflows: { type: array, items: { type: string } }
        checked: { type: boolean }
        already_created: { type: boolean }
    AgentCandidate:
      type: object
      required: [name, role, model, directive, checked, already_created]
      properties:
        name: { type: string }
        role: { type: string }
        model: { type: string }
        directive: { type: string }
        checked: { type: boolean }
        already_created: { type: boolean }
    OverviewCandidate:
      type: object
      required: [draft, checked, already_set]
      properties:
        draft: { type: string }
        checked: { type: boolean }
        already_set: { type: boolean }
    BootstrapPreview:
      type: object
      required: [issues, docs, triggers, agents, overview]
      properties:
        issues: { type: array, items: { $ref: "#/components/schemas/IssueCandidate" } }
        docs: { type: array, items: { $ref: "#/components/schemas/DocCandidate" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/TriggerCandidate" } }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentCandidate" } }
        overview: { $ref: "#/components/schemas/OverviewCandidate" }
    DocChoice:
      type: object
      required: [path, scope]
      properties:
        path: { type: string }
        scope: { $ref: "#/components/schemas/AgentScope" }
        paths: { type: array, items: { type: string } }
    BootstrapApplyRequest:
      type: object
      description: Exactly the checked subset. Absent sections create nothing.
      properties:
        issues: { type: array, items: { type: integer } }
        docs: { type: array, items: { $ref: "#/components/schemas/DocChoice" } }
        triggers:
          type: array
          items: { type: string }
          description: Candidate IDs from the preview.
        agents:
          type: array
          items: { type: string }
          description: Candidate names from the preview.
        overview: { type: [string, "null"] }
    BootstrapApplyResult:
      type: object
      required:
        [tickets_created, issues_skipped, pages_created, docs_skipped, triggers_created,
         agents_created, overview_set]
      properties:
        tickets_created: { type: array, items: { type: string } }
        issues_skipped: { type: array, items: { type: integer } }
        pages_created: { type: array, items: { type: string } }
        docs_skipped: { type: array, items: { type: string } }
        triggers_created: { type: array, items: { type: string } }
        agents_created: { type: array, items: { type: string } }
        overview_set: { type: boolean }
    ColumnCategory:
      type: string
      description: >
        The stable key automation reads (brief D2 / plan rule 3). Code branches on this, never
        on a column's user-facing name.
      enum: [backlog, ready, running, review, done, canceled]
    Column:
      type: object
      required:
        [id, project_id, name, category, position, wip_limit, auto_start_delegate,
         ticket_count, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string, description: A display string; renaming changes nothing functional. }
        category: { $ref: "#/components/schemas/ColumnCategory" }
        position:
          type: integer
          description: Gap-spaced board ordering; treat as opaque and sort by it.
        wip_limit: { type: [integer, "null"], description: Null means no limit. }
        auto_start_delegate:
          type: boolean
          description: >
            Tickets moved into this column automatically start their delegate agent — agent
            runs cost money, so the UI requires an explicit confirm to enable it.
        ticket_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ColumnListResponse:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
    CreateColumnRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { $ref: "#/components/schemas/ColumnCategory" }
    UpdateColumnRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. `wip_limit` accepts an explicit null to
        clear the limit. `after_id` reorders: null moves the column to the front, a column id
        places it immediately after that column.
      properties:
        name: { type: string }
        category: { $ref: "#/components/schemas/ColumnCategory" }
        wip_limit: { type: [integer, "null"] }
        auto_start_delegate: { type: boolean }
        after_id: { type: [string, "null"] }
    WorkspaceSettings:
      type: object
      required:
        [default_branch, default_branch_template, default_network_policy,
         default_daily_budget_cents, default_context_threshold_tokens,
         default_verification_days, max_concurrent_containers, poll_interval_seconds,
         updated_at]
      properties:
        default_branch: { type: string }
        default_branch_template: { type: string }
        default_network_policy: { type: string, enum: [none, allowlist, open] }
        default_daily_budget_cents: { type: integer }
        default_context_threshold_tokens: { type: integer }
        default_verification_days: { type: integer }
        max_concurrent_containers: { type: integer }
        poll_interval_seconds: { type: integer }
        updated_at: { type: string, format: date-time }
    UpdateWorkspaceSettingsRequest:
      type: object
      description: Every field optional; absent = unchanged.
      properties:
        default_branch: { type: string }
        default_branch_template: { type: string }
        default_network_policy: { type: string, enum: [none, allowlist, open] }
        default_daily_budget_cents: { type: integer }
        default_context_threshold_tokens: { type: integer }
        default_verification_days: { type: integer }
        max_concurrent_containers: { type: integer }
        poll_interval_seconds: { type: integer }
    Secret:
      type: object
      description: >
        A secret's metadata (D-16). Deliberately value-free: there is no field for the stored
        value anywhere in this API, and no route that returns one. The UI renders
        "set · <relative updated_at>".
      required: [id, scope, project_id, name, created_at, updated_at]
      properties:
        id: { type: string }
        scope: { type: string, enum: [workspace, project] }
        project_id:
          type: [string, "null"]
          description: Null for workspace-scope secrets.
        name:
          type: string
          description: Env-var shaped — this is the variable name inside a run container (S19).
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the value was last set — the "set · 4 days ago" date.
    SecretListResponse:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    SetSecretRequest:
      type: object
      description: Create the named secret, or replace the existing one's value.
      required: [name, value]
      properties:
        name:
          type: string
          description: "A–Z, 0–9 and _, not starting with a digit; at most 128 characters."
        value:
          type: string
          description: Write-only; at most 64 KiB. Never returned by any route.
    RenameSecretRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    TicketPriority:
      type: string
      enum: [none, low, medium, high, urgent]
    TicketOrigin:
      type: string
      enum: [human, agent, trigger, import]
    Ticket:
      type: object
      description: >
        `category` is the ticket's status, derived from its column's category — never stored,
        never a column name (plan rule 3). `assignee_id` is the accountable human and
        `delegate_agent_id` the working agent — separate axes, not alternatives (D1).
      required:
        [id, project_id, seq, key, title, description, column_id, category, position,
         priority, assignee_id, delegate_agent_id, parent_id, pr_number, pr_state, branch,
         origin, created_by_user_id, created_by_agent_id, label_ids, criteria_total,
         criteria_checked, archived_at, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        seq: { type: integer }
        key: { type: string, description: "'PAY-14' — allocated atomically at creation." }
        title: { type: string }
        description: { type: string }
        column_id: { type: string }
        category: { $ref: "#/components/schemas/ColumnCategory" }
        position:
          type: number
          description: Fractional board ordering; treat as opaque and sort by it.
        priority: { $ref: "#/components/schemas/TicketPriority" }
        assignee_id: { type: [string, "null"] }
        delegate_agent_id: { type: [string, "null"] }
        parent_id: { type: [string, "null"] }
        pr_number: { type: [integer, "null"] }
        pr_state: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        origin: { $ref: "#/components/schemas/TicketOrigin" }
        created_by_user_id: { type: [string, "null"] }
        created_by_agent_id: { type: [string, "null"] }
        label_ids:
          type: array
          items: { type: string }
        criteria_total:
          type: integer
          description: >
            Acceptance-criteria progress (S11): total checklist items. The board card renders
            "▸ 3/5 acceptance criteria" from these two counts — only when criteria_total > 0.
        criteria_checked: { type: integer }
        archived_at: { type: [string, "null"], description: Set = archived (D-15 soft delete). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketListResponse:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [criteria, labels, children]
          properties:
            criteria:
              type: array
              items: { $ref: "#/components/schemas/Criterion" }
            labels:
              type: array
              items: { $ref: "#/components/schemas/Label" }
            children:
              type: array
              items: { $ref: "#/components/schemas/Ticket" }
    CreateTicketRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        column_id:
          type: string
          description: Omit to land in the first backlog-category column.
        assignee_id: { type: string }
        delegate_agent_id: { type: string }
        parent_id: { type: string }
    UpdateTicketRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. The nullable fields accept an explicit
        null to clear (unassign, remove the delegate, detach from parent).
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        assignee_id: { type: [string, "null"] }
        delegate_agent_id: { type: [string, "null"] }
        parent_id: { type: [string, "null"] }
    MoveTicketRequest:
      type: object
      required: [column_id]
      properties:
        column_id: { type: string }
        position:
          type: number
          description: An explicit fractional position, when the client computed it.
        after_ticket_id:
          type: [string, "null"]
          description: >
            Server-side placement: null = top of the column, a ticket id = right after it,
            absent = end of the column.
    SubticketsRequest:
      type: object
      description: One sub-ticket per title. `texts` is accepted as an alias for `titles`.
      properties:
        titles:
          type: array
          items: { type: string }
        texts:
          type: array
          items: { type: string }
    Criterion:
      type: object
      description: >
        One ordered acceptance-criteria checklist item. A human check stamps
        checked_by_user_id; an agent check (S22+) stamps checked_by_run_id.
      required:
        [id, ticket_id, position, text, checked, checked_by_run_id, checked_by_user_id,
         note, updated_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        position: { type: integer }
        text: { type: string }
        checked: { type: boolean }
        checked_by_run_id: { type: [string, "null"] }
        checked_by_user_id: { type: [string, "null"] }
        note: { type: string }
        updated_at: { type: string, format: date-time }
    CreateCriterionRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
    UpdateCriterionRequest:
      type: object
      description: >
        Every field optional; absent = unchanged. `after_id` reorders — null = top, a
        criterion id = right after it.
      properties:
        text: { type: string }
        note: { type: string }
        checked: { type: boolean }
        after_id: { type: [string, "null"] }
    Label:
      type: object
      required: [id, project_id, name, color]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        color: { type: string, description: "#rrggbb" }
    LabelListResponse:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
    UpdateLabelRequest:
      type: object
      description: Every field optional; absent = unchanged.
      properties:
        name: { type: string }
        color: { type: string }
    TicketStreamEntry:
      type: object
      description: >
        One moment in a ticket's single chronological history (data model §4.1). `payload`
        carries an `event` verb ("created", "moved", "assigned", "label_added",
        "criterion_checked", …) plus event-specific details.
      required: [id, ticket_id, kind, actor_kind, actor_id, body, payload, run_id,
                 edited_at, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        kind:
          type: string
          enum: [comment, status_change, field_change, run, pr_event, trigger_fired, proposal]
        actor_kind:
          type: string
          enum: [human, agent, trigger, system]
        actor_id: { type: [string, "null"] }
        body: { type: string, description: Markdown, for comments (S12). }
        payload: {}
        run_id: { type: [string, "null"] }
        edited_at: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    TicketStreamResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TicketStreamEntry" }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: >
            Markdown. `@` mentions are the explicit token form the Editor writes —
            `@[label](user|agent|wiki|ticket:id)`; bare `@name` text is not a mention.
    CommentRunRequest:
      type: object
      description: >
        The honest outcome of one agent mention: the run request went through the scheduler
        seam. Until the S22 scheduler lands, `staged` is always false and `note` says so.
      required: [agent_id, agent_name, staged, note]
      properties:
        agent_id: { type: string }
        agent_name: { type: string }
        staged: { type: boolean }
        note: { type: string }
    CommentResponse:
      type: object
      required: [entry, run_requests]
      properties:
        entry: { $ref: "#/components/schemas/TicketStreamEntry" }
        run_requests:
          type: array
          items: { $ref: "#/components/schemas/CommentRunRequest" }
    Member:
      type: object
      description: One row of the member directory — public display identity only.
      required: [id, display_name, avatar_color]
      properties:
        id: { type: string }
        display_name: { type: string }
        avatar_color: { type: string, description: "#rrggbb" }
    MemberListResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    StreamEventType:
      type: string
      description: >
        The SSE `event:` names (contracts §5.1, plus the S10 ticket/label events and S12's
        ticket.commented).
      enum:
        - run.state
        - run.activity
        - run.step
        - run.usage
        - run.elicitation
        - ticket.created
        - ticket.updated
        - ticket.commented
        - ticket.moved
        - ticket.archived
        - ticket.unarchived
        - label.created
        - label.updated
        - label.deleted
        - board.updated
        - triage.created
        - trigger.fired
        - notification.updated
        - wiki.proposed
        - provision.step
        - module.degraded
    StreamFrame:
      type: object
      description: The `data:` payload of every SSE frame.
      required: [topic, payload]
      properties:
        topic: { type: string }
        payload: {}
